<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵感雷达 v2</title>
  <style>
    :root {
      --ink: #f0ece6; --ink-2: #c4bdb5; --muted: #6e6560; --subtle: #4a4540;
      --amber: #f0b429; --coral: #ee6b3b;
      --lib-score: #7a7060;
      --accent: #c49a30; --accent-dim: #d4aa40;
      --warm-border: rgba(200,170,80,.1);
      --r: 14px; --r-sm: 8px;
    }
    *,*::before,*::after { box-sizing: border-box }
    body {
      margin: 0; overflow: hidden; height: 100vh; width: 100vw;
      font-family: Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      font-size: 14px; line-height: 1.6; color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 30% 20%, #120e08 0%, #0a0806 60%, #060503 100%);
    }
    button { font: inherit; cursor: pointer; }

    /* Loading */
    .loading-veil {
      position: fixed; inset: 0; z-index: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0a0806; transition: opacity .9s ease;
    }
    .loading-veil.out { opacity: 0; pointer-events: none; }
    .spin-ring {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid rgba(200,160,40,.18); border-top-color: var(--amber);
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-veil p { color: var(--muted); font-size: 13px; margin: 0; }

    /* HUD */
    .hud {
      position: fixed; inset: 0; z-index: 100; pointer-events: none;
      display: grid;
      grid-template: "tl . tr" auto ".  .  ." 1fr "bl . br" auto / auto 1fr auto;
      padding: 22px 26px; gap: 0;
    }
    .hud > * { pointer-events: auto; }

    .hud-logo { grid-area: tl; display: flex; align-items: center; gap: 10px; }
    .logo-gem {
      width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg, #8a6820, #c49a30);
      display: grid; place-items: center;
      box-shadow: 0 0 20px rgba(196,154,48,.4);
    }
    .logo-gem svg { width: 18px; height: 18px; fill: white; }
    .logo-text strong { display: block; font-size: 15px; font-weight: 700; color: #f0ece6; letter-spacing: -.01em; }
    .logo-text span { display: block; font-size: 11px; color: #4a4540; margin-top: 1px; }

    .hud-status { grid-area: tr; display: flex; align-items: center; gap: 8px; }
    .status-pill {
      display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
      background: rgba(10,8,6,.85); backdrop-filter: blur(12px);
      border: 1px solid var(--warm-border); color: var(--muted); font-size: 12px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; background: #34d399; box-shadow: 0 0 6px #34d399; animation: dpulse 2.2s ease-in-out infinite; }
    .status-dot.mock { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .hud-bc {
      grid-area: bl / tl / br / br;
      display: flex; flex-direction: row; align-items: flex-end;
      justify-content: space-between; padding: 0 32px 28px; pointer-events: none;
    }
    .hud-bc > * { pointer-events: auto; }
    .hud-left-panel {
      display: flex; flex-direction: column; gap: 8px;
      opacity: 0; pointer-events: none; transition: opacity .5s ease;
    }
    .hud-center-panel {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .hud-right-panel {
      opacity: 0; pointer-events: none; transition: opacity .5s ease;
      display: flex; align-items: flex-end;
    }
    .hud-bc.bg-active .hud-left-panel,
    .hud-bc.bg-active .hud-right-panel { opacity: 1; pointer-events: auto; }
    .hud-bc.bg-active .hud-center-panel #filter-fg,
    .hud-bc.bg-active .hud-center-panel .depth-track-wrap { display: none; }
    .depth-track-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .depth-labels { display: flex; gap: 80px; font-size: 11px; font-weight: 500; }
    .depth-lbl { transition: color .4s ease, font-weight .4s ease; }
    .depth-lbl.active { color: var(--accent-dim); font-weight: 600; }
    .depth-lbl.inactive { color: #2a2520; }
    .depth-track { width: 140px; height: 3px; border-radius: 2px; background: rgba(200,160,40,.14); position: relative; }
    .depth-cursor {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--amber); box-shadow: 0 0 14px var(--amber);
      position: absolute; top: -5.5px; left: 0;
      transition: left 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .depth-btn {
      display: flex; align-items: center; gap: 7px; padding: 9px 22px; border-radius: 999px;
      border: 1.5px solid rgba(200,160,40,.22); background: rgba(10,8,6,.9); backdrop-filter: blur(14px);
      color: var(--muted); font-size: 13px; font-weight: 500; transition: all .2s ease;
    }
    .depth-btn:hover { background: rgba(200,160,40,.1); border-color: var(--amber); color: var(--amber); box-shadow: 0 0 20px rgba(200,160,40,.15); }
    .depth-count { font-size: 11px; color: var(--subtle); letter-spacing: .03em; margin-bottom: 2px; }

    /* Filter shelf */
    .filter-shelf {
      display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;
      max-width: 560px; overflow-x: auto; padding: 0 2px;
    }
    .filter-shelf::-webkit-scrollbar { display: none; }
    .fpill {
      padding: 4px 11px; border-radius: 999px; flex: 0 0 auto;
      border: 1px solid rgba(200,170,80,.18); background: rgba(10,8,6,.72);
      color: var(--subtle); font-size: 11px; font-weight: 500; white-space: nowrap;
      cursor: pointer; transition: all .15s ease; backdrop-filter: blur(8px);
    }
    .fpill:hover { color: var(--ink-2); border-color: rgba(200,170,80,.32); }
    .fpill.active { background: rgba(200,160,40,.14); color: var(--accent-dim); border-color: rgba(200,160,40,.32); }
    .fpill-sep { width: 1px; height: 13px; background: rgba(200,170,80,.16); flex: 0 0 auto; margin: 0 3px; }
    .depth-btn svg { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* 3D Stage */
    .perspective-root { position: fixed; inset: 0; z-index: 1; perspective: 1400px; perspective-origin: 50% 50%; overflow: hidden; }
    .stage { position: absolute; inset: 0; transform-style: preserve-3d; }

    /* Layers */
    .layer-fg, .layer-bg {
      position: absolute; inset: 0;
      transition: transform 1.45s cubic-bezier(0.16,1,.3,1), opacity 1.1s cubic-bezier(0.16,1,.3,1), filter 1.1s ease;
    }
    .layer-fg { transform: translateZ(0); opacity: 1; }
    .layer-bg { transform: translateZ(-1400px); opacity: 0.14; filter: blur(1.5px); pointer-events: none; }
    .stage.bg-mode .layer-fg { transform: translateZ(900px) scale(1.4); opacity: 0; pointer-events: none; }
    .stage.bg-mode .layer-bg { transform: translateZ(0); opacity: 1; filter: none; pointer-events: auto; }

    /* FG: Today pair */
    .today-pair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      width: 680px; height: 480px;
      z-index: 5;
    }
    .today-float-wrap { position: absolute; }
    .today-float-wrap.fa { left: 0; top: 0; animation: fa 4.4s ease-in-out infinite; }
    .today-float-wrap.fb { right: 0; bottom: 0; animation: fb 5.2s ease-in-out infinite; }
    .today-float-wrap.fb .today-card { transform: rotate(-1.8deg); transform-origin: center top; }
    .today-float-wrap.fa:hover,
    .today-float-wrap.fb:hover { animation-play-state: paused; }
    @keyframes fa { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes fb { 0%,100%{transform:translateY(-9px)} 50%{transform:translateY(7px)} }

    /* Today card — pure typography, no box */
    .today-card { width: 280px; cursor: pointer; padding: 0; position: relative; }

    /* Accent line: grows on hover */
    .tc-accent {
      width: 22px; height: 2px; border-radius: 1px;
      background: var(--amber); margin-bottom: 20px;
      transition: width .35s cubic-bezier(0.22,1,.36,1);
    }
    .today-card.cd .tc-accent { background: var(--coral); }
    .today-card:hover .tc-accent { width: 52px; }

    .tc-score-wrap { margin-bottom: 16px; }
    .tc-score-num { font-size: 84px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.85; color: var(--amber); }
    .tc-score-num.cd { color: var(--coral); }
    .tc-score-den { font-size: 15px; color: var(--subtle); margin-left: 2px; }

    .tc-dir { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--subtle); margin-bottom: 8px; }
    .tc-title { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.3; margin: 0 0 11px; transition: color .2s ease; }
    .today-card:hover .tc-title { color: #fff; }
    .tc-pain {
      font-size: 13px; color: var(--muted); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      transition: color .2s ease;
    }
    .today-card:hover .tc-pain { color: var(--ink-2); }
    .tc-meta { display: flex; align-items: center; gap: 14px; margin-top: 15px; }
    .tc-type-tag { font-size: 11px; font-weight: 600; color: var(--amber); letter-spacing: .02em; }
    .tc-type-tag.cd { color: var(--coral); }
    .tc-src-name { font-size: 11px; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

    /* FG: Orbit cards — pure typography */
    .orbit-cards { position: absolute; inset: 0; }
    .orbit-card {
      position: absolute; width: 150px; cursor: pointer;
      transform: scale(0.72); opacity: 0.22;
      transition: transform .25s ease, opacity .25s ease; z-index: 2;
    }
    .orbit-card:hover { transform: scale(0.95) !important; opacity: 0.65 !important; z-index: 10; }
    .oc-score-num { font-size: 34px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.9; color: var(--lib-score); }
    .oc-dir-txt { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--subtle); margin: 7px 0 4px; }
    .oc-title-txt { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .orbit-card:hover .oc-title-txt { color: var(--ink); }

    /* BG Layer */
    #conn-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .nodes-container { position: absolute; inset: 0; }
    .src-node { position: absolute; transform: translate(-50%,-50%); z-index: 2; cursor: pointer; }
    .node-dot { border-radius: 50%; transition: transform .5s ease, opacity .5s ease; position: relative; }
    .node-dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; background: inherit; opacity: 0.18; filter: blur(5px); pointer-events: none; }

    .node-card {
      position: absolute; left: 6px; top: 6px; width: 210px;
      background: rgba(18,14,8,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--warm-border); border-radius: 10px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,.55);
      opacity: 0; transform: scale(0.2); transform-origin: 0 0;
      transition: opacity .55s cubic-bezier(0.22,1,.36,1), transform .55s cubic-bezier(0.22,1,.36,1);
      transition-delay: var(--delay,0ms); pointer-events: none;
    }
    .nc-hero { padding: 10px 12px 8px; border-bottom: 1px solid var(--warm-border); }
    .nc-title { font-size: 11.5px; font-weight: 600; color: var(--ink); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nc-body { padding: 8px 12px 10px; }
    .nc-meta { font-size: 11px; color: var(--muted); }
    .nc-badge { display: inline-block; padding: 2px 7px; border-radius: 999px; background: rgba(200,160,40,.1); color: var(--accent-dim); font-size: 10.5px; margin-top: 5px; border: 1px solid rgba(200,160,40,.2); }

    .layer-bg.expanded .node-dot { transform: scale(0); opacity: 0; }
    .layer-bg.expanded .node-card { opacity: 1; transform: scale(1); pointer-events: auto; }
    .node-card.node-open { opacity: 1 !important; transform: scale(1) !important; pointer-events: auto !important; transition-delay: 0ms !important; }

    .expand-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 999px;
      border: 1.5px solid rgba(200,160,40,.25); background: rgba(10,8,6,.92); backdrop-filter: blur(16px);
      color: var(--muted); font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,.45); transition: all .2s ease;
    }
    .expand-btn:hover { background: rgba(200,160,40,.1); border-color: var(--amber); color: var(--amber); }
    .expand-btn svg { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Tooltip */
    .tooltip {
      position: fixed; z-index: 300; pointer-events: none;
      padding: 7px 12px; max-width: 260px;
      background: rgba(12,10,6,.97); border: 1px solid var(--warm-border);
      border-radius: 8px; color: var(--ink-2); font-size: 12px; line-height: 1.45;
      backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0,0,0,.5);
      opacity: 0; transition: opacity .12s ease;
    }
    .tooltip.on { opacity: 1; }

    /* Modal */
    .modal-veil {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: grid; place-items: center; padding: 40px 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .modal-veil.open { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%; max-width: 660px; max-height: calc(100vh - 80px);
      background: rgba(10,8,6,.99); border: 1px solid var(--warm-border); border-radius: 20px;
      overflow-y: auto; overflow-x: hidden;
      box-shadow: 0 28px 90px rgba(0,0,0,.8);
      transform: scale(.94) translateY(10px); transition: transform .3s cubic-bezier(0.22,1,.36,1);
    }
    .modal-veil.open .modal { transform: scale(1) translateY(0); }

    .modal-topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; padding: 14px 24px;
      background: rgba(10,8,6,.97); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--warm-border);
    }
    .modal-topbar span { font-size: 11px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; }
    .modal-x { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; transition: background .15s, color .15s; }
    .modal-x:hover { background: rgba(200,160,40,.1); color: var(--amber); }
    .modal-x svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .modal-hero { padding: 28px 24px 24px; border-bottom: 1px solid var(--warm-border); }
    .mh-dir { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--subtle); margin-bottom: 10px; }
    .mh-score-wrap { margin-bottom: 14px; }
    .mh-score { font-size: 64px; font-weight: 900; letter-spacing: -.04em; line-height: 0.88; color: var(--amber); }
    .mh-score.cd { color: var(--coral); }
    .mh-score-den { font-size: 16px; color: var(--subtle); margin-left: 3px; }
    .modal-hero h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.3; }

    .modal-sources {
      padding: 11px 24px; border-bottom: 1px solid rgba(200,160,40,.07);
      background: rgba(200,160,40,.025);
      display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    }
    .modal-sources > span { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
    .src-link { color: var(--accent-dim); font-size: 12.5px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .src-link:hover { color: var(--amber); text-decoration: underline; }
    .src-link svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

    .modal-fields { padding: 16px 24px; border-bottom: 1px solid rgba(200,160,40,.07); display: grid; gap: 10px; }
    .mf { display: grid; grid-template-columns: 82px 1fr; gap: 6px; font-size: 13px; }
    .mf-l { color: var(--muted); font-weight: 500; padding-top: 1px; }
    .mf-v { color: var(--ink-2); line-height: 1.55; }

    .modal-score-sec { padding: 14px 24px; border-bottom: 1px solid rgba(200,160,40,.07); }
    .sec-lbl { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 11px; }
    .dim-row { display: grid; grid-template-columns: 82px 1fr 36px; gap: 8px; align-items: center; margin-bottom: 7px; }
    .dm-name { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .dm-wt { font-size: 11px; color: var(--subtle); margin-top: 1px; }
    .bar-wrap { height: 5px; background: rgba(200,160,40,.1); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.22,1,.36,1); }
    .bar-fill.s5{background:linear-gradient(90deg,#10b981,#34d399)}
    .bar-fill.s4{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
    .bar-fill.s3{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .bar-fill.s2{background:linear-gradient(90deg,#f97316,#fb923c)}
    .bar-fill.s1{background:linear-gradient(90deg,#ef4444,#f87171)}
    .dm-score-v { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: right; }
    .score-total-row { margin-top: 11px; padding-top: 10px; border-top: 1px dashed rgba(200,160,40,.15); display: flex; align-items: center; justify-content: space-between; }
    .score-total-row span { font-size: 12px; color: var(--muted); }
    .score-total-row strong { font-size: 20px; font-weight: 900; color: var(--amber); }

    .modal-notes { padding: 12px 24px 22px; display: grid; gap: 8px; }
    .note { padding: 10px 13px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; }
    .note.risk { background: rgba(120,20,10,.22); border: 1px solid rgba(239,68,68,.18); color: #fca5a5; }
    .note.check { background: rgba(5,46,22,.22); border: 1px solid rgba(52,211,153,.18); color: #6ee7b7; }
    .note strong { display: block; margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }

    .today-empty { width: 280px; padding: 60px 0; color: var(--muted); }
    .today-empty p { margin: 0 0 6px; font-size: 15px; color: var(--ink-2); }

    @media(max-width: 720px) {
      .today-pair { flex-direction: column; align-items: flex-start; gap: 48px; top: 12%; left: 50%; transform: translateX(-50%); }
      .orbit-cards { display: none; }
      .today-float-wrap.fa, .today-float-wrap.fb { animation: none; }
      .hud { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- Loading veil -->
<div class="loading-veil" id="loading-veil">
  <div class="spin-ring"></div>
  <p>正在校准灵感雷达…</p>
</div>

<!-- HUD -->
<div class="hud">
  <div class="hud-logo">
    <div class="logo-gem">
      <svg viewBox="0 0 24 24"><path d="M12 2 9.1 9.1 2 12l7.1 2.9L12 22l2.9-7.1L22 12l-7.1-2.9z"/></svg>
    </div>
    <div class="logo-text">
      <strong>灵感雷达</strong>
      <span id="hud-date">捕捉灵感信号</span>
    </div>
  </div>

  <div class="hud-status">
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">正在连接…</span>
    </div>
  </div>

  <div class="hud-bc">
    <!-- Left: BG filters (BG mode only) -->
    <div class="hud-left-panel">
      <div class="filter-shelf" id="filter-bg">
        <button class="fpill active" data-filter="bg-status" data-value="all">全部信号</button>
        <button class="fpill" data-filter="bg-status" data-value="linked">已关联卡片</button>
        <button class="fpill" data-filter="bg-status" data-value="unlinked">未关联</button>
        <div class="fpill-sep"></div>
        <button class="fpill active" data-filter="bg-type" data-value="all">全部类型</button>
        <button class="fpill" data-filter="bg-type" data-value="cross">跨界来源</button>
      </div>
    </div>

    <!-- Center: FG filters + depth track + count + nav button (always visible) -->
    <div class="hud-center-panel">
      <div class="filter-shelf" id="filter-fg">
        <button class="fpill active" data-filter="fg-type" data-value="all">全部</button>
        <button class="fpill" data-filter="fg-type" data-value="related">◎ 相关</button>
        <button class="fpill" data-filter="fg-type" data-value="crossdomain">⚡ 跨界</button>
        <div class="fpill-sep"></div>
        <button class="fpill active" data-filter="fg-score" data-value="0">全部分数</button>
        <button class="fpill" data-filter="fg-score" data-value="8">8分+</button>
        <button class="fpill" data-filter="fg-score" data-value="7">7分+</button>
      </div>

function esc(s) {
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}
function strip(s) {
  return (s || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
}
function short(s, max) {
  const t = strip(s);
  return t.length > max ? t.slice(0, max) + '…' : t;
}
function fmtDate(s) {
  const d = new Date(s); if (isNaN(d)) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function srcHost(url) { try { return new URL(url).hostname.replace('www.',''); } catch { return url; } }
function scoreCls(v) { return v>=5?'s5':v>=4?'s4':v>=3?'s3':v>=2?'s2':'s1'; }
function mapCard(c) {
  let st = c.source_titles || [], su = c.source_urls || [];
  if (typeof st === 'string') { try { st = JSON.parse(st); } catch { st = []; } }
  if (typeof su === 'string') { try { su = JSON.parse(su); } catch { su = []; } }
  if (!st.length && c.source_title) st = [c.source_title];
  if (!su.length && c.source_url) su = [c.source_url];
  return {
    id: c.id, title: c.title, direction: c.direction,
    sourceTitles: st, sourceUrls: su,
    sourceTitle: st[0] || c.source_title || '',
    sourceLink: su[0] || c.source_url || '#',
    user: c.user_persona, pain: c.pain_point, why: c.ai_solution,
    mvp: c.mvp_plan, risk: c.risks, check: c.next_step,
    scores: typeof c.score === 'object' ? c.score : {},
    score: c.score && c.score.total ? c.score.total : 0,
    cardType: c.card_type || 'related',
  };
}

// ─────────────────────────────────────
// Data Loading
// ─────────────────────────────────────
async function loadData() {
  let err = null;
  try {
    const [tr, sr] = await Promise.all([
      fetch('/api/cards/today', { signal: AbortSignal.timeout(8000) }),
      fetch('/api/sources',     { signal: AbortSignal.timeout(8000) }),
    ]);
    if (!tr.ok || !sr.ok) throw new Error('API error');
    const [td, sd] = await Promise.all([tr.json(), sr.json()]);
    todayCards = (td.cards || []).map(mapCard);
    allSources  = (sd.items || []).map(item => {
      const raw = item.published_at || '';
      let pd = '';
      if (raw) { try { pd = new Date(raw).toISOString().slice(0,10); } catch {} }
      return { title: item.title || '', link: item.url || item.link || '', pubDate: pd, pubDateRaw: raw };
    });
  } catch (e) { err = e; }

  if (!err) {
    try {
      const lr = await fetch('/api/cards', { signal: AbortSignal.timeout(8000) });
      if (lr.ok) { const ld = await lr.json(); library = (ld.cards || []).map(mapCard); }
    } catch {}
  }

  if (err || !todayCards.length) {
    // Fallback to mock
    todayCards = MOCK_DATA.todayCards;
    library    = MOCK_DATA.library;
    allSources = MOCK_DATA.sources;
    isMock = true;
  }

  // HUD updates
  document.getElementById('hud-date').textContent = todayStr();
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (isMock) {
    dot.classList.add('mock');
    txt.textContent = '⚡ 演示模式';
  } else {
    txt.textContent = `${allSources.length} 条信号`;
  }
}

function applyFgFilters(cards) {
  return cards.filter(c => {
    if (filters.fgType !== 'all' && c.cardType !== filters.fgType) return false;
    if (filters.fgScore > 0 && c.score < filters.fgScore) return false;
    return true;
  });
}

function applyBgFilters(sources) {
  const convUrls  = new Set([...todayCards, ...library].flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));
  const crossUrls = new Set(todayCards.filter(c => c.cardType === 'crossdomain').flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));
  return sources.filter(s => {
    const isLinked = convUrls.has(s.link);
    const isCross  = crossUrls.has(s.link);
    if (filters.bgStatus === 'linked'   && !isLinked) return false;
    if (filters.bgStatus === 'unlinked' &&  isLinked) return false;
    if (filters.bgCross  === 'cross'    && !isCross)  return false;
    return true;
  });
}

function initFilters() {
  document.querySelectorAll('.fpill').forEach(btn => {
    btn.addEventListener('click', () => {
      const ft = btn.dataset.filter, val = btn.dataset.value;
      document.querySelectorAll(`.fpill[data-filter="${ft}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switch (ft) {
        case 'fg-type':  filters.fgType  = val; break;
        case 'fg-score': filters.fgScore = Number(val); break;
        case 'bg-status':filters.bgStatus= val; break;
        case 'bg-type':  filters.bgCross = val; break;
      }
      if (ft.startsWith('fg-')) { renderTodayCards(); renderOrbit(); }
      else { if (rafId) cancelAnimationFrame(rafId); initNodes(); }
    });
  });
}

      <div class="tc-meta">
        <span class="tc-type-tag${isCross ? ' cd' : ''}">${isCross ? '⚡ 跨界' : '◎ 相关'}</span>
        <span class="tc-src-name">${esc(short(card.sourceTitle || card.sourceLink, 30))}</span>
      </div>`;
    el.addEventListener('click', () => openModal(card));
    wrap.appendChild(el);
    pair.appendChild(wrap);
  });

  requestAnimationFrame(() => requestAnimationFrame(drawCollisionLine));
}

function drawCollisionLine() {
  const svg = document.getElementById('collision-svg');
  if (!svg) return;
  const cards = document.querySelectorAll('.today-card');
  if (cards.length < 2) { svg.innerHTML = ''; return; }

  const r0 = cards[0].getBoundingClientRect();
  const r1 = cards[1].getBoundingClientRect();
  const x1 = r0.left + r0.width * 0.7;
  const y1 = r0.top  + r0.height * 0.4;
  const x2 = r1.left + r1.width * 0.3;
  const y2 = r1.top  + r1.height * 0.35;
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;

  svg.innerHTML = `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
          stroke="rgba(200,160,40,.14)" stroke-width="1" stroke-dasharray="5,7"/>
    <circle cx="${mx}" cy="${my}" r="3.5" fill="rgba(240,180,60,.65)"/>
    <circle cx="${mx}" cy="${my}" r="3.5" fill="rgba(240,180,60,.25)">
      <animate attributeName="r" values="3.5;11;3.5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>`;
}

// ─────────────────────────────────────
// FG: Orbit cards
// ─────────────────────────────────────
function renderOrbit() {
  const container = document.getElementById('orbit-cards');
  container.innerHTML = '';
  if (!library.length) return;

  const cards = applyFgFilters(library).slice(0, 20);
  const total = cards.length;
  const r = Math.min(window.innerWidth * 0.38, window.innerHeight * 0.4, 380);

  cards.forEach((card, i) => {
    const isCross = card.cardType === 'crossdomain';
    const angle = (i / total) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;

    const el = document.createElement('div');
    el.className = 'orbit-card';
    el.style.left = `calc(50% + ${x}px - 99px)`;
    el.style.top  = `calc(50% + ${y}px - 55px)`;
    el.innerHTML = `
      <div class="oc-score-num">${card.score.toFixed(1)}</div>
      <div class="oc-dir-txt">${esc(short(card.direction, 14))}</div>
      <div class="oc-title-txt">${esc(short(card.title, 40))}</div>`;
    el.addEventListener('click', () => openModal(card));
    container.appendChild(el);
  });
}

// ─────────────────────────────────────
// BG: Nodes
// ─────────────────────────────────────
function initNodes() {
  const container = document.getElementById('nodes-container');
  container.innerHTML = '';
  nodes = [];

  const convUrls  = new Set([...todayCards, ...library].flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));
  const crossUrls = new Set(todayCards.filter(c => c.cardType === 'crossdomain').flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));

  const W = window.innerWidth, H = window.innerHeight;

  applyBgFilters(allSources).forEach((s, i) => {
    const isConv  = convUrls.has(s.link);
    const isCross = crossUrls.has(s.link);
    const color   = isConv ? (isCross ? '#ee6b3b' : '#c49a30') : 'rgba(240,220,190,0.3)';
    const size    = isConv ? 7 : 4;

    // Random position, avoid screen center (where FG cards are)
    let bx, by, tries = 0;
    do {
      bx = 60 + Math.random() * (W - 120);
      by = 60 + Math.random() * (H - 120);
      tries++;
    } while (tries < 20 && Math.abs(bx - W/2) < 320 && Math.abs(by - H/2) < 260);

    const wrapper = document.createElement('div');
    wrapper.className = 'src-node';
    wrapper.style.left = bx + 'px';
    wrapper.style.top  = by + 'px';

    const dot = document.createElement('div');
    dot.className = 'node-dot';
    dot.style.cssText = `width:${size*2}px;height:${size*2}px;background:${color};`;

    const card = document.createElement('div');
    card.className = 'node-card';
    card.style.setProperty('--delay', (i * 55) + 'ms');
    card.innerHTML = `
      <div class="nc-hero">
        <div class="nc-title">${esc(short(s.title, 60))}</div>
      </div>
      <div class="nc-body">
        <div class="nc-meta">${s.pubDate || ''} · ${srcHost(s.link)}</div>
        ${isConv ? '<span class="nc-badge">已生成机会卡</span>' : ''}
      </div>`;

    wrapper.appendChild(dot);
    wrapper.appendChild(card);
    container.appendChild(wrapper);

    const nodeObj = {
      el: wrapper, dotEl: dot,
      bx, by, cx: bx, cy: by,
      phase: Math.random() * Math.PI * 2,
      speed: 0.25 + Math.random() * 0.5,
      driftR: 18 + Math.random() * 45,
      hovered: false,
    };
    nodes.push(nodeObj);

    // Hover: pause drift + tooltip
    wrapper.addEventListener('mouseenter', (e) => {
      nodeObj.hovered = true;
      const t = document.getElementById('tooltip');
      t.textContent = short(s.title, 80);
      t.classList.add('on');
      positionTooltip(e);
    });
    wrapper.addEventListener('mousemove', positionTooltip);
    wrapper.addEventListener('mouseleave', () => {
      nodeObj.hovered = false;
      document.getElementById('tooltip').classList.remove('on');
    });

    // Click: expand individual node card
    wrapper.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = card.classList.contains('node-open');
      document.querySelectorAll('.node-card.node-open').forEach(c => c.classList.remove('node-open'));
      if (!isOpen) card.classList.add('node-open');
    });
  });

  // Click on background closes any open node card
  document.getElementById('layer-bg').addEventListener('click', (e) => {
    if (!e.target.closest('.src-node')) {
      document.querySelectorAll('.node-card.node-open').forEach(c => c.classList.remove('node-open'));
    }
  });

  initLines();
  startAnimation();
}

function positionTooltip(e) {
  const t = document.getElementById('tooltip');
  const tw = 260, th = 50;
  let lx = e.clientX + 14, ly = e.clientY - 10;
  if (lx + tw > window.innerWidth - 10) lx = e.clientX - tw - 10;
  if (ly + th > window.innerHeight - 10) ly = e.clientY - th - 10;
  t.style.left = lx + 'px';
  t.style.top  = ly + 'px';
}

// Pre-create SVG line elements for performance
function initLines() {
  const svg = document.getElementById('conn-svg');
  svg.innerHTML = '';
  lineEls = [];
  const n = nodes.length;
  const maxPairs = n * (n - 1) / 2;
  for (let i = 0; i < maxPairs; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('stroke-width', '1');
    line.style.display = 'none';
    svg.appendChild(line);
    lineEls.push(line);
  }
  // Resize SVG
  svg.setAttribute('width',  window.innerWidth);
  svg.setAttribute('height', window.innerHeight);
}

function updateConnections() {
  let li = 0;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (li >= lineEls.length) break;
      const dx = nodes[j].cx - nodes[i].cx;
      const dy = nodes[j].cy - nodes[i].cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const line = lineEls[li++];
      if (dist < 190) {
        const alpha = ((1 - dist / 190) * 0.3).toFixed(2);
        line.setAttribute('x1', nodes[i].cx | 0);
        line.setAttribute('y1', nodes[i].cy | 0);
        line.setAttribute('x2', nodes[j].cx | 0);
        line.setAttribute('y2', nodes[j].cy | 0);
        line.setAttribute('stroke', `rgba(180,140,60,${alpha})`);
        line.style.display = '';
      } else {
        line.style.display = 'none';
      }
    }
  }
  for (; li < lineEls.length; li++) lineEls[li].style.display = 'none';
}

function startAnimation() {
  if (rafId) cancelAnimationFrame(rafId);
  rafT0 = null;

  function tick(t) {
    if (!rafT0) rafT0 = t;
    const elapsed = t - rafT0;

    if (!bgExpanded) {
      nodes.forEach(n => {
        if (!n.hovered) {
          n.cx = n.bx + Math.sin(elapsed * 0.00038 * n.speed + n.phase) * n.driftR;
          n.cy = n.by + Math.cos(elapsed * 0.00028 * n.speed + n.phase * 1.4) * n.driftR * 0.65;
        }
        n.el.style.left = n.cx + 'px';
        n.el.style.top  = n.cy + 'px';
      });
      updateConnections();
    }

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ─────────────────────────────────────
// Expand / Collapse
// ─────────────────────────────────────
function toggleExpand() {
  bgExpanded = !bgExpanded;
  const layerBg = document.getElementById('layer-bg');
  const btn = document.getElementById('expand-btn');

  if (bgExpanded) {
    // Freeze node positions before expanding
    nodes.forEach(n => {
      n.el.style.left = n.cx + 'px';
      n.el.style.top  = n.cy + 'px';
    });
    layerBg.classList.add('expanded');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg> 折叠信号`;
  } else {
    layerBg.classList.remove('expanded');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg> 展开全部信号`;
    // Resume base positions from current frozen positions
    nodes.forEach(n => { n.bx = n.cx; n.by = n.cy; });
  }
}

// ─────────────────────────────────────
// Depth Navigation
// ─────────────────────────────────────
function goToBackground() {
  if (isBackground || isAnimating) return;
  isBackground = true; isAnimating = true;
  document.getElementById('stage').classList.add('bg-mode');
  updateHUD();
  setTimeout(() => { isAnimating = false; }, 1300);
}

function goToForeground() {
  if (!isBackground || isAnimating) return;
  isBackground = false; isAnimating = true;
  document.getElementById('stage').classList.remove('bg-mode');
  if (bgExpanded) toggleExpand();
  updateHUD();
  setTimeout(() => { isAnimating = false; }, 1300);
}

function updateHUD() {
  const cursor = document.getElementById('depth-cursor');
  const btn    = document.getElementById('depth-btn');
  const lFg    = document.getElementById('dlbl-fg');
  const lBg    = document.getElementById('dlbl-bg');

  const hudBc = document.querySelector('.hud-bc');
  if (hudBc) hudBc.classList.toggle('bg-active', isBackground);

  const count = document.getElementById('depth-count');
  if (count) {
    count.textContent = isBackground
      ? `${applyBgFilters(allSources).length} 条信号`
      : `今日 ${applyFgFilters(todayCards).length} 张 · 历史 ${applyFgFilters(library).length} 张`;
  }

  if (isBackground) {
    cursor.style.left = 'calc(100% - 14px)';
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg> 浮出机会`;
    lFg.className = 'depth-lbl inactive'; lBg.className = 'depth-lbl active';
  } else {
    cursor.style.left = '0';
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg> 潜入信号源`;
    lFg.className = 'depth-lbl active'; lBg.className = 'depth-lbl inactive';
  }
}

// Scroll to navigate depth
let wheelTimer = null;
window.addEventListener('wheel', (e) => {
  // Modal open → let modal scroll naturally, don't intercept
  if (document.getElementById('modal-veil').classList.contains('open')) return;
  e.preventDefault();
  if (isAnimating) { wheelAccum = 0; return; }
  wheelAccum += e.deltaY;
  if (wheelTimer) clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if      (wheelAccum >  60 && !isBackground) goToBackground();
    else if (wheelAccum < -60 &&  isBackground) goToForeground();
    wheelAccum = 0;
    wheelTimer = null;
  }, 80);
}, { passive: false });

document.getElementById('depth-btn').addEventListener('click', () => {
  if (isBackground) goToForeground(); else goToBackground();
});

document.getElementById('expand-btn').addEventListener('click', toggleExpand);

// Window resize
window.addEventListener('resize', () => {
  const svg = document.getElementById('conn-svg');
  if (svg) {
    svg.setAttribute('width',  window.innerWidth);
    svg.setAttribute('height', window.innerHeight);
  }
  // Re-layout orbit cards
  renderOrbit();
});

// ─────────────────────────────────────
// Modal
// ─────────────────────────────────────
function openModal(card) {
  const isCross = card.cardType === 'crossdomain';
  document.getElementById('m-score').className   = `mh-score${isCross ? ' cd' : ''}`;
  document.getElementById('m-score').textContent = card.score.toFixed(1);
  document.getElementById('m-dir').textContent   = card.direction;
  document.getElementById('m-title').textContent = card.title;

  // Sources
  const srcEl = document.getElementById('m-sources');
  srcEl.innerHTML = '<span>来源</span>';
  const titles = card.sourceTitles.length ? card.sourceTitles : [card.sourceTitle || ''];
  const urls   = card.sourceUrls.length   ? card.sourceUrls   : [card.sourceLink  || '#'];
  titles.forEach((t, i) => {
    srcEl.insertAdjacentHTML('beforeend',
      `<a href="${urls[i]||'#'}" target="_blank" class="src-link">${LINK_SVG}<span>${esc(short(t, 52))}</span></a>`);
  });

  document.getElementById('m-user').textContent  = card.user;
  document.getElementById('m-pain').textContent  = card.pain;
  document.getElementById('m-why').textContent   = card.why;
  document.getElementById('m-mvp').textContent   = card.mvp;
  document.getElementById('m-risk').textContent  = card.risk;
  document.getElementById('m-check').textContent = card.check;
  document.getElementById('m-total').textContent = card.score.toFixed(1) + ' / 10';

  const dimsEl = document.getElementById('m-dims');
  dimsEl.innerHTML = DIMS.map(d => {
    const raw = card.scores[d.key];
    const v = raw && typeof raw === 'object' ? (raw.value || 0) : (Number(raw) || 0);
    const reason = raw && typeof raw === 'object' ? (raw.reason || '') : '';
    return `<div class="dim-row">
      <div><div class="dm-name">${d.name}</div><div class="dm-wt">×${Math.round(d.weight/10*100)}%${reason ? ' — '+reason : ''}</div></div>
      <div class="bar-wrap"><div class="bar-fill ${scoreCls(v)}" style="width:0" data-w="${v/5*100}%"></div></div>
      <span class="dm-score-v">${v}/5</span>
    </div>`;
  }).join('');

  // Animate bars
  requestAnimationFrame(() => requestAnimationFrame(() => {
    dimsEl.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.w; });
  }));

  document.getElementById('modal-veil').classList.add('open');
}

function closeModal() { document.getElementById('modal-veil').classList.remove('open'); }

document.getElementById('modal-x').addEventListener('click', closeModal);
document.getElementById('modal-veil').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-veil')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ─────────────────────────────────────
// Init
// ─────────────────────────────────────
async function init() {
  await loadData();

  initFilters();
  renderTodayCards();
  renderOrbit();
  initNodes();
  updateHUD();

  // Fade out loading veil
  const veil = document.getElementById('loading-veil');
  veil.classList.add('out');
  setTimeout(() => { veil.style.display = 'none'; }, 1000);
}

init();
</script>
