<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵感雷达 v2</title>
  <style>
    :root {
      --ink: #e2e8f0; --ink-2: #cbd5e1; --muted: #64748b; --subtle: #475569;
      --accent: #818cf8; --accent-dim: #a5b4fc;
      --glass-bg: rgba(12,16,38,.78);
      --glass-border: rgba(99,102,241,.18);
      --r: 14px; --r-sm: 8px;
    }
    *,*::before,*::after { box-sizing: border-box }
    body {
      margin: 0; overflow: hidden; height: 100vh; width: 100vw;
      font-family: Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      font-size: 14px; line-height: 1.6; color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 20% 30%, #16103a 0%, #080c18 55%, #020409 100%);
    }
    /* Radar sweep */
    body::before {
      content: ''; position: fixed;
      top: 50%; left: 50%;
      width: 280vmax; height: 280vmax; margin: -140vmax;
      background: conic-gradient(from 0deg,
        transparent 354deg, rgba(99,102,241,.025) 357deg, rgba(139,92,246,.08) 360deg);
      border-radius: 50%;
      animation: radar-sweep 14s linear infinite;
      pointer-events: none; z-index: 0;
    }
    @keyframes radar-sweep { to { transform: rotate(360deg); } }

    button { font: inherit; cursor: pointer; }

    /* ── Loading ── */
    .loading-veil {
      position: fixed; inset: 0; z-index: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #080c18;
      transition: opacity .9s ease;
    }
    .loading-veil.out { opacity: 0; pointer-events: none; }
    .spin-ring {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid rgba(99,102,241,.18);
      border-top-color: var(--accent);
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-veil p { color: var(--muted); font-size: 13px; margin: 0; }

    /* ── HUD ── */
    .hud {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
      display: grid;
      grid-template:
        "tl . tr" auto
        ".  .  ." 1fr
        "bl . br" auto
        / auto 1fr auto;
      padding: 22px 26px;
      gap: 0;
    }
    .hud > * { pointer-events: auto; }

    /* Logo */
    .hud-logo {
      grid-area: tl;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-gem {
      width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      display: grid; place-items: center;
      box-shadow: 0 0 22px rgba(167,139,250,.55);
    }
    .logo-gem svg { width: 18px; height: 18px; fill: white; }
    .logo-text strong { display: block; font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: -.01em; }
    .logo-text span { display: block; font-size: 11px; color: #475569; margin-top: 1px; }

    /* Status */
    .hud-status {
      grid-area: tr;
      display: flex; align-items: center; gap: 8px;
    }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 999px;
      background: rgba(8,12,28,.82); backdrop-filter: blur(12px);
      border: 1px solid rgba(99,102,241,.16);
      color: var(--muted); font-size: 12px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
      background: #34d399; box-shadow: 0 0 6px #34d399;
      animation: dpulse 2.2s ease-in-out infinite;
    }
    .status-dot.mock { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
    @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* Bottom left */
    .hud-bl {
      grid-area: bl;
      display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
      padding-bottom: 2px;
    }
    .spark-stat {
      font-size: 12px; color: var(--muted);
      background: rgba(8,12,28,.8); backdrop-filter: blur(8px);
      border: 1px solid rgba(99,102,241,.12);
      padding: 5px 12px; border-radius: 999px;
    }
    .spark-stat strong { color: var(--ink-2); font-weight: 600; margin: 0 2px; }

    /* Bottom center — depth navigation */
    .hud-bc {
      grid-area: bl / tl / br / br; /* spans full bottom */
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      justify-content: flex-end; padding-bottom: 2px;
      pointer-events: none;
    }
    .hud-bc > * { pointer-events: auto; }
    .depth-track-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
    }
    .depth-labels {
      display: flex; gap: 80px; font-size: 11px; font-weight: 500;
    }
    .depth-lbl { transition: color .4s ease, font-weight .4s ease; }
    .depth-lbl.active { color: var(--accent-dim); font-weight: 600; }
    .depth-lbl.inactive { color: #334155; }
    .depth-track {
      width: 140px; height: 3px; border-radius: 2px;
      background: rgba(99,102,241,.14); position: relative;
    }
    .depth-cursor {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 14px var(--accent);
      position: absolute; top: -5.5px; left: 0;
      transition: left 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .depth-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 22px; border-radius: 999px;
      border: 1.5px solid rgba(99,102,241,.28);
      background: rgba(8,12,28,.88); backdrop-filter: blur(14px);
      color: var(--accent-dim); font-size: 13px; font-weight: 500;
      transition: all .2s ease;
    }
    .depth-btn:hover {
      background: rgba(99,102,241,.14); border-color: var(--accent);
      box-shadow: 0 0 22px rgba(99,102,241,.22);
    }
    .depth-btn svg { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── 3D Stage ── */
    .perspective-root {
      position: fixed; inset: 0; z-index: 1;
      perspective: 1400px;
      perspective-origin: 50% 50%;
      overflow: hidden;
    }
    .stage {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
    }

    /* ── Layers ── */
    .layer-fg, .layer-bg {
      position: absolute; inset: 0;
      transition:
        transform 1.45s cubic-bezier(0.16, 1, 0.3, 1),
        opacity   1.1s  cubic-bezier(0.16, 1, 0.3, 1),
        filter    1.1s  ease;
    }
    /* Foreground — default position */
    .layer-fg { transform: translateZ(0); opacity: 1; }
    /* Background — far behind, tiny and dim */
    .layer-bg { transform: translateZ(-1400px); opacity: 0.14; filter: blur(1.5px); pointer-events: none; }

    /* Switch to background mode */
    .stage.bg-mode .layer-fg {
      transform: translateZ(900px) scale(1.4);
      opacity: 0; pointer-events: none;
    }
    .stage.bg-mode .layer-bg {
      transform: translateZ(0);
      opacity: 1; filter: none; pointer-events: auto;
    }

    /* ── FG: Today cards centered pair ── */
    .today-pair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; gap: 22px; align-items: flex-start;
      z-index: 5;
    }
    .today-float-wrap { display: block; }
    .today-float-wrap.fa { animation: fa 4.4s ease-in-out infinite; }
    .today-float-wrap.fb { animation: fb 5.2s ease-in-out infinite; }
    @keyframes fa { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    @keyframes fb { 0%,100%{transform:translateY(-10px)} 50%{transform:translateY(8px)} }

    .today-card {
      width: 320px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.65), 0 4px 16px rgba(99,102,241,.16);
      cursor: pointer;
      transition: box-shadow .22s ease;
    }
    .today-card:hover {
      box-shadow: 0 28px 80px rgba(0,0,0,.75), 0 0 48px rgba(99,102,241,.32);
    }
    .tc-hero {
      padding: 20px 20px 16px;
      background: linear-gradient(135deg, rgba(99,102,241,.92), rgba(139,92,246,.82));
    }
    .tc-hero.cd {
      background: linear-gradient(135deg, rgba(245,158,11,.9), rgba(236,72,153,.8));
    }
    .tc-top {
      display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;
    }
    .tc-score { font-size: 38px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -.03em; }
    .tc-score-den { font-size: 14px; color: rgba(255,255,255,.35); }
    .dir-pill {
      padding: 4px 11px; border-radius: 999px;
      background: rgba(255,255,255,.12); color: rgba(255,255,255,.9);
      font-size: 11.5px; font-weight: 500;
      border: 1px solid rgba(255,255,255,.18);
    }
    .tc-hero h3 { margin: 0; font-size: 14.5px; font-weight: 700; color: #fff; line-height: 1.4; }

    .tc-body { padding: 14px 20px; }
    .type-pip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 600; margin-bottom: 8px;
    }
    .type-pip.related { background: rgba(99,102,241,.18); color: #c4b5fd; border: 1px solid rgba(99,102,241,.32); }
    .type-pip.cd {
      background: rgba(245,158,11,.16); color: #fcd34d; border: 1px solid rgba(245,158,11,.28);
      animation: cdp 2.8s ease-in-out infinite;
    }
    @keyframes cdp { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 0 4px rgba(245,158,11,.1)} }
    .tc-pain {
      font-size: 12.5px; color: var(--ink-2); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tc-foot {
      padding: 10px 20px; border-top: 1px solid rgba(99,102,241,.1);
      display: flex; align-items: center; justify-content: space-between;
    }
    .tc-src { font-size: 11.5px; color: var(--muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
    .tc-src svg { flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tc-more { font-size: 11.5px; color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .tc-more svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── FG: Orbit cards ── */
    .orbit-cards { position: absolute; inset: 0; }
    .orbit-card {
      position: absolute; width: 198px;
      background: rgba(8,12,28,.84);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(99,102,241,.12);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,.5);
      cursor: pointer;
      transform: scale(0.85); opacity: 0.62;
      transition: transform .25s ease, opacity .25s ease, box-shadow .25s ease, border-color .25s ease;
      z-index: 2;
    }
    .orbit-card:hover {
      transform: scale(1.02) !important;
      opacity: 1 !important;
      box-shadow: 0 16px 52px rgba(0,0,0,.7), 0 0 28px rgba(99,102,241,.28);
      border-color: rgba(99,102,241,.35);
      z-index: 10;
    }
    .oc-hero {
      padding: 10px 12px 8px;
      background: linear-gradient(135deg, rgba(99,102,241,.82), rgba(139,92,246,.72));
    }
    .oc-hero.cd { background: linear-gradient(135deg, rgba(245,158,11,.82), rgba(236,72,153,.72)); }
    .oc-score { font-size: 24px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -.02em; }
    .oc-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.88); line-height: 1.35; margin-top: 4px; }
    .oc-body { padding: 8px 12px 10px; }
    .oc-pain { font-size: 11px; color: var(--ink-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .oc-tag { display: inline-block; padding: 2px 7px; border-radius: 999px; background: rgba(99,102,241,.1); color: var(--accent-dim); font-size: 10.5px; margin-top: 6px; border: 1px solid rgba(99,102,241,.18); }

    /* ── BG Layer ── */
    #conn-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .nodes-container { position: absolute; inset: 0; }

    .src-node {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
      cursor: pointer;
    }

    .node-dot {
      border-radius: 50%;
      transition: transform .5s ease, opacity .5s ease;
      position: relative;
    }
    /* soft glow ring around dot */
    .node-dot::after {
      content: ''; position: absolute; inset: -6px;
      border-radius: 50%; background: inherit; opacity: 0.18; filter: blur(5px);
      pointer-events: none;
    }

    /* Card state (hidden by default) */
    .node-card {
      position: absolute; left: 6px; top: 6px; width: 210px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      opacity: 0; transform: scale(0.2);
      transform-origin: 0 0;
      transition:
        opacity  .55s cubic-bezier(0.22,1,.36,1),
        transform .55s cubic-bezier(0.22,1,.36,1);
      transition-delay: var(--delay, 0ms);
      pointer-events: none;
    }
    .nc-hero {
      padding: 10px 12px 8px;
      background: linear-gradient(135deg, rgba(99,102,241,.85), rgba(139,92,246,.75));
    }
    .nc-title { font-size: 11.5px; font-weight: 600; color: #fff; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nc-body { padding: 8px 12px 10px; }
    .nc-meta { font-size: 11px; color: var(--muted); }
    .nc-badge { display: inline-block; padding: 2px 7px; border-radius: 999px; background: rgba(99,102,241,.14); color: var(--accent-dim); font-size: 10.5px; margin-top: 5px; border: 1px solid rgba(99,102,241,.22); }

    /* Expanded state */
    .layer-bg.expanded .node-dot { transform: scale(0); opacity: 0; }
    .layer-bg.expanded .node-card { opacity: 1; transform: scale(1); pointer-events: auto; }

    /* Expand button — fades in after depth transition completes */
    .expand-btn-wrap {
      position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 10; opacity: 0; pointer-events: none;
      transition: opacity .6s ease 1s; /* 1s delay after bg transition */
    }
    .stage.bg-mode .expand-btn-wrap { opacity: 1; pointer-events: auto; }
    .expand-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 999px;
      border: 1.5px solid rgba(99,102,241,.32);
      background: rgba(8,12,28,.92); backdrop-filter: blur(16px);
      color: var(--accent-dim); font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      transition: all .2s ease;
    }
    .expand-btn:hover {
      background: rgba(99,102,241,.15); border-color: var(--accent);
      box-shadow: 0 4px 28px rgba(99,102,241,.3);
    }
    .expand-btn svg { width: 14px; height: 14px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed; z-index: 300; pointer-events: none;
      padding: 7px 12px; max-width: 260px;
      background: rgba(10,14,30,.97); border: 1px solid rgba(99,102,241,.28);
      border-radius: 9px; color: var(--ink-2); font-size: 12px; line-height: 1.45;
      backdrop-filter: blur(12px); box-shadow: 0 4px 18px rgba(0,0,0,.45);
      opacity: 0; transition: opacity .12s ease;
    }
    .tooltip.on { opacity: 1; }

    /* ── Modal ── */
    .modal-veil {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center; padding: 40px 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .modal-veil.open { opacity: 1; pointer-events: all; }

    .modal {
      width: 100%; max-width: 680px; max-height: calc(100vh - 80px);
      background: rgba(8,12,28,.98);
      border: 1px solid rgba(99,102,241,.18); border-radius: 22px;
      overflow-y: auto; overflow-x: hidden;
      box-shadow: 0 28px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(99,102,241,.1);
      transform: scale(.94) translateY(10px);
      transition: transform .3s cubic-bezier(0.22,1,.36,1);
    }
    .modal-veil.open .modal { transform: scale(1) translateY(0); }

    .modal-topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: rgba(8,12,28,.96); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(99,102,241,.1);
    }
    .modal-topbar span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .modal-x {
      width: 30px; height: 30px; border-radius: var(--r-sm); border: 0;
      background: transparent; color: var(--muted);
      display: grid; place-items: center;
      transition: background .15s, color .15s;
    }
    .modal-x:hover { background: rgba(99,102,241,.12); color: var(--accent); }
    .modal-x svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .modal-hero {
      padding: 24px 22px 20px;
      background: linear-gradient(135deg, rgba(99,102,241,.92), rgba(139,92,246,.82));
    }
    .modal-hero.cd { background: linear-gradient(135deg, rgba(245,158,11,.9), rgba(236,72,153,.8)); }
    .mh-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .mh-score { font-size: 52px; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -.04em; }
    .mh-score-sub { font-size: 12px; color: rgba(255,255,255,.38); margin-top: 3px; }
    .modal-hero h2 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; line-height: 1.35; }

    .modal-sources {
      padding: 12px 22px; border-bottom: 1px solid rgba(99,102,241,.1);
      background: rgba(99,102,241,.04);
      display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    }
    .modal-sources > span { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
    .src-link { color: var(--accent); font-size: 12.5px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .src-link:hover { text-decoration: underline; }
    .src-link svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

    .modal-fields { padding: 16px 22px; border-bottom: 1px solid rgba(99,102,241,.08); display: grid; gap: 10px; }
    .mf { display: grid; grid-template-columns: 82px 1fr; gap: 6px; font-size: 13px; }
    .mf-l { color: var(--muted); font-weight: 500; padding-top: 1px; }
    .mf-v { color: var(--ink-2); line-height: 1.55; }

    .modal-score-sec { padding: 14px 22px; border-bottom: 1px solid rgba(99,102,241,.08); }
    .sec-lbl { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 11px; }
    .dim-row { display: grid; grid-template-columns: 82px 1fr 36px; gap: 8px; align-items: center; margin-bottom: 7px; }
    .dm-name { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .dm-wt { font-size: 11px; color: var(--subtle); margin-top: 1px; }
    .bar-wrap { height: 5px; background: rgba(99,102,241,.1); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .9s cubic-bezier(.22,1,.36,1); }
    .bar-fill.s5{background:linear-gradient(90deg,#10b981,#34d399)}
    .bar-fill.s4{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
    .bar-fill.s3{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .bar-fill.s2{background:linear-gradient(90deg,#f97316,#fb923c)}
    .bar-fill.s1{background:linear-gradient(90deg,#ef4444,#f87171)}
    .dm-score-v { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: right; }
    .score-total-row {
      margin-top: 11px; padding-top: 10px;
      border-top: 1px dashed rgba(99,102,241,.18);
      display: flex; align-items: center; justify-content: space-between;
    }
    .score-total-row span { font-size: 12px; color: var(--muted); }
    .score-total-row strong { font-size: 20px; font-weight: 800; color: var(--accent); }

    .modal-notes { padding: 12px 22px 20px; display: grid; gap: 8px; }
    .note { padding: 10px 13px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; }
    .note.risk { background: rgba(120,20,10,.22); border: 1px solid rgba(239,68,68,.18); color: #fca5a5; }
    .note.check { background: rgba(5,46,22,.22); border: 1px solid rgba(52,211,153,.18); color: #6ee7b7; }
    .note strong { display: block; margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }

    /* ── Empty state ── */

function esc(s) {
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}
function strip(s) {
  return (s || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
}
function short(s, max) {
  const t = strip(s);
  return t.length > max ? t.slice(0, max) + '…' : t;
}
function fmtDate(s) {
  const d = new Date(s); if (isNaN(d)) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function srcHost(url) { try { return new URL(url).hostname.replace('www.',''); } catch { return url; } }
function scoreCls(v) { return v>=5?'s5':v>=4?'s4':v>=3?'s3':v>=2?'s2':'s1'; }
function mapCard(c) {
  let st = c.source_titles || [], su = c.source_urls || [];
  if (typeof st === 'string') { try { st = JSON.parse(st); } catch { st = []; } }
  if (typeof su === 'string') { try { su = JSON.parse(su); } catch { su = []; } }
  if (!st.length && c.source_title) st = [c.source_title];
  if (!su.length && c.source_url) su = [c.source_url];
  return {
    id: c.id, title: c.title, direction: c.direction,
    sourceTitles: st, sourceUrls: su,
    sourceTitle: st[0] || c.source_title || '',
    sourceLink: su[0] || c.source_url || '#',
    user: c.user_persona, pain: c.pain_point, why: c.ai_solution,
    mvp: c.mvp_plan, risk: c.risks, check: c.next_step,
    scores: typeof c.score === 'object' ? c.score : {},
    score: c.score && c.score.total ? c.score.total : 0,
    cardType: c.card_type || 'related',
  };
}

async function loadData() {
  let err = null;
  try {
    const [tr, sr] = await Promise.all([
      fetch('/api/cards/today', { signal: AbortSignal.timeout(8000) }),
      fetch('/api/sources',     { signal: AbortSignal.timeout(8000) }),
    ]);
    if (!tr.ok || !sr.ok) throw new Error('API error');
    const [td, sd] = await Promise.all([tr.json(), sr.json()]);
    todayCards = (td.cards || []).map(mapCard);
    allSources  = (sd.items || []).map(item => {
      const raw = item.published_at || '';
      let pd = '';
      if (raw) { try { pd = new Date(raw).toISOString().slice(0,10); } catch {} }
      return { title: item.title || '', link: item.url || item.link || '', pubDate: pd, pubDateRaw: raw };
    });
  } catch (e) { err = e; }

  if (!err) {
    try {
      const lr = await fetch('/api/cards', { signal: AbortSignal.timeout(8000) });
      if (lr.ok) { const ld = await lr.json(); library = (ld.cards || []).map(mapCard); }
    } catch {}
  }

  if (err || !todayCards.length) {
    // Fallback to mock
    todayCards = MOCK_DATA.todayCards;
    library    = MOCK_DATA.library;
    allSources = MOCK_DATA.sources;
    isMock = true;
  }

  // HUD updates
  document.getElementById('hud-date').textContent = todayStr();
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (isMock) {
    dot.classList.add('mock');
    txt.textContent = '⚡ 演示模式';
  } else {
    txt.textContent = `${allSources.length} 条信号`;
  }
}

}

// ─────────────────────────────────────
// FG: Orbit cards
// ─────────────────────────────────────
function renderOrbit() {
  const container = document.getElementById('orbit-cards');
  container.innerHTML = '';
  if (!library.length) return;

  const cards = library.slice(0, 10);
  const total = cards.length;
  const r = Math.min(window.innerWidth * 0.38, window.innerHeight * 0.4, 380);

  cards.forEach((card, i) => {
    const isCross = card.cardType === 'crossdomain';
    const angle = (i / total) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;

    const el = document.createElement('div');
    el.className = 'orbit-card';
    el.style.left = `calc(50% + ${x}px - 99px)`;
    el.style.top  = `calc(50% + ${y}px - 55px)`;
    el.innerHTML = `
      <div class="oc-hero ${isCross ? 'cd' : ''}">
        <div class="oc-score">${card.score.toFixed(1)}</div>
        <div class="oc-title">${esc(short(card.title, 42))}</div>
      </div>
      <div class="oc-body">
        <div class="oc-pain">${esc(short(card.pain, 65))}</div>
        <span class="oc-tag">${esc(card.direction)}</span>
      </div>`;
    el.addEventListener('click', () => openModal(card));
    container.appendChild(el);
  });
}

// ─────────────────────────────────────
// BG: Nodes
// ─────────────────────────────────────
function initNodes() {
  const container = document.getElementById('nodes-container');
  container.innerHTML = '';
  nodes = [];

  const convUrls  = new Set([...todayCards, ...library].flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));
  const crossUrls = new Set(todayCards.filter(c => c.cardType === 'crossdomain').flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink || '']));

  const W = window.innerWidth, H = window.innerHeight;

  allSources.forEach((s, i) => {
    const isConv  = convUrls.has(s.link);
    const isCross = crossUrls.has(s.link);
    const color   = isConv ? (isCross ? '#f59e0b' : '#818cf8') : 'rgba(255,255,255,0.45)';
    const size    = isConv ? 7 : 4;

    // Random position, avoid screen center (where FG cards are)
    let bx, by, tries = 0;
    do {
      bx = 60 + Math.random() * (W - 120);
      by = 60 + Math.random() * (H - 120);
      tries++;
    } while (tries < 20 && Math.abs(bx - W/2) < 320 && Math.abs(by - H/2) < 260);

    const wrapper = document.createElement('div');
    wrapper.className = 'src-node';
    wrapper.style.left = bx + 'px';
    wrapper.style.top  = by + 'px';

    const dot = document.createElement('div');
    dot.className = 'node-dot';
    dot.style.cssText = `width:${size*2}px;height:${size*2}px;background:${color};`;

    const card = document.createElement('div');
    card.className = 'node-card';
    card.style.setProperty('--delay', (i * 55) + 'ms');
    card.innerHTML = `
      <div class="nc-hero">
        <div class="nc-title">${esc(short(s.title, 60))}</div>
      </div>
      <div class="nc-body">
        <div class="nc-meta">${s.pubDate || ''} · ${srcHost(s.link)}</div>
        ${isConv ? '<span class="nc-badge">已生成机会卡</span>' : ''}
      </div>`;

    wrapper.appendChild(dot);
    wrapper.appendChild(card);
    container.appendChild(wrapper);

    // Tooltip
    wrapper.addEventListener('mouseenter', (e) => {
      const t = document.getElementById('tooltip');
      t.textContent = short(s.title, 80);
      t.classList.add('on');
      positionTooltip(e);
    });
    wrapper.addEventListener('mousemove', positionTooltip);
    wrapper.addEventListener('mouseleave', () => document.getElementById('tooltip').classList.remove('on'));

    nodes.push({
      el: wrapper, dotEl: dot,
      bx, by, cx: bx, cy: by,
      phase: Math.random() * Math.PI * 2,
      speed: 0.25 + Math.random() * 0.5,
      driftR: 18 + Math.random() * 45,
    });
  });

  initLines();
  startAnimation();
}

function positionTooltip(e) {
  const t = document.getElementById('tooltip');
  const tw = 260, th = 50;
  let lx = e.clientX + 14, ly = e.clientY - 10;
  if (lx + tw > window.innerWidth - 10) lx = e.clientX - tw - 10;
  if (ly + th > window.innerHeight - 10) ly = e.clientY - th - 10;
  t.style.left = lx + 'px';
  t.style.top  = ly + 'px';
}

// Pre-create SVG line elements for performance
function initLines() {
  const svg = document.getElementById('conn-svg');
  svg.innerHTML = '';
  lineEls = [];
  const n = nodes.length;
  const maxPairs = n * (n - 1) / 2;
  for (let i = 0; i < maxPairs; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('stroke-width', '1');
    line.style.display = 'none';
    svg.appendChild(line);
    lineEls.push(line);
  }
  // Resize SVG
  svg.setAttribute('width',  window.innerWidth);
  svg.setAttribute('height', window.innerHeight);
}

function updateConnections() {
  let li = 0;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (li >= lineEls.length) break;
      const dx = nodes[j].cx - nodes[i].cx;
      const dy = nodes[j].cy - nodes[i].cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const line = lineEls[li++];
      if (dist < 190) {
        const alpha = ((1 - dist / 190) * 0.3).toFixed(2);
        line.setAttribute('x1', nodes[i].cx | 0);
        line.setAttribute('y1', nodes[i].cy | 0);
        line.setAttribute('x2', nodes[j].cx | 0);
        line.setAttribute('y2', nodes[j].cy | 0);
        line.setAttribute('stroke', `rgba(99,102,241,${alpha})`);
        line.style.display = '';
      } else {
        line.style.display = 'none';
      }
    }
  }
  for (; li < lineEls.length; li++) lineEls[li].style.display = 'none';
}

function startAnimation() {
  if (rafId) cancelAnimationFrame(rafId);
  rafT0 = null;

  function tick(t) {
    if (!rafT0) rafT0 = t;
    const elapsed = t - rafT0;

    if (!bgExpanded) {
      nodes.forEach(n => {
        n.cx = n.bx + Math.sin(elapsed * 0.00038 * n.speed + n.phase) * n.driftR;
        n.cy = n.by + Math.cos(elapsed * 0.00028 * n.speed + n.phase * 1.4) * n.driftR * 0.65;
        n.el.style.left = n.cx + 'px';
        n.el.style.top  = n.cy + 'px';
      });
      updateConnections();
    }

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ─────────────────────────────────────
// Expand / Collapse
// ─────────────────────────────────────
function toggleExpand() {
  bgExpanded = !bgExpanded;
  const layerBg = document.getElementById('layer-bg');
  const btn = document.getElementById('expand-btn');

  if (bgExpanded) {
    // Freeze node positions before expanding
    nodes.forEach(n => {
      n.el.style.left = n.cx + 'px';
      n.el.style.top  = n.cy + 'px';
    });
    layerBg.classList.add('expanded');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg> 折叠信号`;
  } else {
    layerBg.classList.remove('expanded');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg> 展开全部信号`;
    // Resume base positions from current frozen positions
    nodes.forEach(n => { n.bx = n.cx; n.by = n.cy; });
  }
}

// ─────────────────────────────────────
// Depth Navigation
// ─────────────────────────────────────
function goToBackground() {
  if (isBackground || isAnimating) return;
  isBackground = true; isAnimating = true;
  document.getElementById('stage').classList.add('bg-mode');
  updateHUD();
  setTimeout(() => { isAnimating = false; }, 1300);
}

function goToForeground() {
  if (!isBackground || isAnimating) return;
  isBackground = false; isAnimating = true;
  document.getElementById('stage').classList.remove('bg-mode');
  if (bgExpanded) toggleExpand();
  updateHUD();
  setTimeout(() => { isAnimating = false; }, 1300);
}

function updateHUD() {
  const cursor = document.getElementById('depth-cursor');
  const btn    = document.getElementById('depth-btn');
  const lFg    = document.getElementById('dlbl-fg');
  const lBg    = document.getElementById('dlbl-bg');

  if (isBackground) {
    cursor.style.left = 'calc(100% - 14px)';
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg> 浮出机会`;
    lFg.className = 'depth-lbl inactive'; lBg.className = 'depth-lbl active';
  } else {
    cursor.style.left = '0';
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg> 潜入信号源`;
    lFg.className = 'depth-lbl active'; lBg.className = 'depth-lbl inactive';
  }
}

// Scroll to navigate depth
let wheelTimer = null;
window.addEventListener('wheel', (e) => {
  // Modal open → let modal scroll naturally, don't intercept
  if (document.getElementById('modal-veil').classList.contains('open')) return;
  e.preventDefault();
  if (isAnimating) { wheelAccum = 0; return; }
  wheelAccum += e.deltaY;
  if (wheelTimer) clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if      (wheelAccum >  60 && !isBackground) goToBackground();
    else if (wheelAccum < -60 &&  isBackground) goToForeground();
    wheelAccum = 0;
    wheelTimer = null;
  }, 80);
}, { passive: false });

document.getElementById('depth-btn').addEventListener('click', () => {
  if (isBackground) goToForeground(); else goToBackground();
});

document.getElementById('expand-btn').addEventListener('click', toggleExpand);

// Window resize
window.addEventListener('resize', () => {
  const svg = document.getElementById('conn-svg');
  if (svg) {
    svg.setAttribute('width',  window.innerWidth);
    svg.setAttribute('height', window.innerHeight);
  }
  // Re-layout orbit cards
  renderOrbit();
});

// ─────────────────────────────────────
// Modal
// ─────────────────────────────────────
function openModal(card) {
  const isCross = card.cardType === 'crossdomain';
  document.getElementById('m-hero').className = `modal-hero${isCross ? ' cd' : ''}`;
  document.getElementById('m-score').textContent = card.score.toFixed(1);
  document.getElementById('m-dir').textContent   = card.direction;
  document.getElementById('m-title').textContent = card.title;

  // Sources
  const srcEl = document.getElementById('m-sources');
  srcEl.innerHTML = '<span>来源</span>';
  const titles = card.sourceTitles.length ? card.sourceTitles : [card.sourceTitle || ''];
  const urls   = card.sourceUrls.length   ? card.sourceUrls   : [card.sourceLink  || '#'];
  titles.forEach((t, i) => {
    srcEl.insertAdjacentHTML('beforeend',
      `<a href="${urls[i]||'#'}" target="_blank" class="src-link">${LINK_SVG}<span>${esc(short(t, 52))}</span></a>`);
  });

  document.getElementById('m-user').textContent  = card.user;
  document.getElementById('m-pain').textContent  = card.pain;
  document.getElementById('m-why').textContent   = card.why;
  document.getElementById('m-mvp').textContent   = card.mvp;
  document.getElementById('m-risk').textContent  = card.risk;
  document.getElementById('m-check').textContent = card.check;
  document.getElementById('m-total').textContent = card.score.toFixed(1) + ' / 10';

  const dimsEl = document.getElementById('m-dims');
  dimsEl.innerHTML = DIMS.map(d => {
    const raw = card.scores[d.key];
    const v = raw && typeof raw === 'object' ? (raw.value || 0) : (Number(raw) || 0);
    const reason = raw && typeof raw === 'object' ? (raw.reason || '') : '';
    return `<div class="dim-row">
      <div><div class="dm-name">${d.name}</div><div class="dm-wt">×${Math.round(d.weight/10*100)}%${reason ? ' — '+reason : ''}</div></div>
      <div class="bar-wrap"><div class="bar-fill ${scoreCls(v)}" style="width:0" data-w="${v/5*100}%"></div></div>
      <span class="dm-score-v">${v}/5</span>
    </div>`;
  }).join('');

  // Animate bars
  requestAnimationFrame(() => requestAnimationFrame(() => {
    dimsEl.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.w; });
  }));

  document.getElementById('modal-veil').classList.add('open');
}

function closeModal() { document.getElementById('modal-veil').classList.remove('open'); }

document.getElementById('modal-x').addEventListener('click', closeModal);
document.getElementById('modal-veil').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-veil')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ─────────────────────────────────────
// Init
// ─────────────────────────────────────
async function init() {
  await loadData();

  renderTodayCards();
  renderOrbit();
  initNodes();
  updateHUD();

  // Fade out loading veil
  const veil = document.getElementById('loading-veil');
  veil.classList.add('out');
  setTimeout(() => { veil.style.display = 'none'; }, 1000);
}

init();
</script>
