<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵感雷达 · AI 产品机会</title>
  <style>
    :root {
      --bg: #080c18;
      --surface: rgba(12,16,38,.72);
      --surface-2: rgba(8,12,28,.5);
      --ink: #e2e8f0;
      --ink-2: #cbd5e1;
      --muted: #64748b;
      --subtle: #475569;
      --line: rgba(99,102,241,.15);
      --accent: #818cf8;
      --accent-dim: #a5b4fc;
      --accent-bg: rgba(99,102,241,.12);
      --accent-bd: rgba(99,102,241,.3);
      --good: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --glass-bg: rgba(12,16,38,.72);
      --glass-border: rgba(99,102,241,.18);
      --glass-shadow: 0 8px 32px rgba(0,0,0,.45),0 2px 8px rgba(99,102,241,.07);
      --glass-blur: blur(24px) saturate(180%);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.3),0 1px 3px rgba(99,102,241,.06);
      --shadow: 0 16px 48px rgba(0,0,0,.55),0 4px 12px rgba(99,102,241,.12);
      --r: 14px; --r-sm: 8px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);
      font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
      background:radial-gradient(ellipse at 20% 25%,#1a1040 0%,#080c18 55%,#030510 100%);
      background-attachment:fixed}
    /* Radar sweep — pure CSS rotating conic line */
    body::before{content:'';position:fixed;
      top:50%;left:calc(50% + 114px);
      width:260vmax;height:260vmax;margin:-130vmax;
      background:conic-gradient(from 0deg,
        transparent 354deg,
        rgba(99,102,241,.035) 357deg,
        rgba(139,92,246,.11) 360deg);
      border-radius:50%;
      animation:radar-sweep 10s linear infinite;
      pointer-events:none;z-index:0}
    @keyframes radar-sweep{to{transform:rotate(360deg)}}
    button,input,textarea{font:inherit}

    /* ── App shell ── */
    .app{display:flex;min-height:100vh;position:relative;z-index:1}

    /* ── Sidebar ── */
    .sidebar{width:228px;flex:0 0 228px;
      background:linear-gradient(180deg,#0e1224 0%,#07090f 100%);
      display:flex;flex-direction:column;padding:20px 14px 24px;
      position:sticky;top:0;height:100vh;overflow-y:auto;
      border-right:1px solid rgba(99,102,241,.1)}
    .brand{display:flex;align-items:center;gap:10px;
      padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:8px}
    .brand-icon{width:36px;height:36px;border-radius:9px;
      background:linear-gradient(135deg,#a78bfa,#60a5fa);
      display:grid;place-items:center;flex:0 0 auto;
      box-shadow:0 0 22px rgba(167,139,250,.55)}
    .brand-icon svg{width:20px;height:20px}
    .brand-text strong{display:block;color:#f1f5f9;font-size:14px;font-weight:600;letter-spacing:-.01em}
    .brand-text span{display:block;color:#64748b;font-size:11px;margin-top:1px}
    .nav{flex:1;display:flex;flex-direction:column;gap:2px}
    .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;
      border-radius:var(--r-sm);border:0;background:transparent;color:#64748b;
      cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;transition:all .2s ease}
    .nav-item:hover{background:rgba(99,102,241,.1);color:#cbd5e1}
    .nav-item.active{background:rgba(99,102,241,.18);color:#a5b4fc;
      box-shadow:inset 0 0 0 1px rgba(99,102,241,.35),0 0 14px rgba(99,102,241,.18)}
    .nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .nav-badge{margin-left:auto;background:rgba(99,102,241,.28);color:#a5b4fc;
      font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
    .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.05)}

    /* ── Hamburger ── */
    .hamburger{display:none;align-items:center;justify-content:center;
      width:36px;height:36px;border:0;background:transparent;cursor:pointer;
      padding:0;flex:0 0 auto;border-radius:var(--r-sm);color:var(--ink)}
    .hamburger:hover{background:rgba(99,102,241,.1);color:var(--accent)}

    /* ── Sidebar overlay (mobile) ── */
    .sidebar-overlay{display:none}

    .src-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;
      border-radius:var(--r-sm);background:rgba(255,255,255,.03)}
    .src-dot{width:7px;height:7px;border-radius:50%;background:#34d399;flex:0 0 auto;
      box-shadow:0 0 7px #34d399;animation:dot-pulse 2.2s ease-in-out infinite}
    @keyframes dot-pulse{0%,100%{opacity:1;box-shadow:0 0 7px #34d399}50%{opacity:.5;box-shadow:0 0 3px #34d399}}
    .src-badge span{color:#475569;font-size:12px}
    .src-badge strong{color:#64748b;font-size:12px}

    /* ── Main ── */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{background:rgba(5,7,16,.9);backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      border-bottom:1px solid rgba(99,102,241,.12);padding:14px 28px;
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;justify-content:space-between;gap:16px}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .topbar-left h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
    .topbar-left p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
    .topbar-right{display:flex;align-items:center;gap:8px}

    /* ── Stat bar ── */
    .stat-bar{display:flex;align-items:center;gap:18px;
      padding:10px 28px;
      background:rgba(5,7,16,.78);backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(99,102,241,.08);
      font-size:12.5px;color:var(--muted)}
    .stat-item{display:flex;align-items:center;gap:6px}
    .stat-item svg{width:13px;height:13px;stroke:currentColor;fill:none;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .stat-item strong{color:var(--ink-2);font-weight:600}
    .stat-sep{color:rgba(99,102,241,.22)}

    /* ── Views ── */
    .view{display:none}
    .view.active{display:block}

    /* ── Today view ── */
    .today-layout{padding:24px 28px}
    .section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .section-hd h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
    .section-hd p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}

    /* ── Skeleton loading ── */
    .loading-wrap{padding:24px 28px}
    .skeleton-list{display:grid;gap:20px}
    .skeleton-card{border-radius:var(--r);overflow:hidden;
      background:var(--glass-bg);backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
    .sk-hero{height:120px;position:relative;overflow:hidden;
      background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.06))}
    .sk-hero::after{content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(139,92,246,.09) 50%,transparent 100%);
      background-size:200% 100%;animation:shimmer 2s ease-in-out infinite}
    .sk-body{padding:16px 20px;display:grid;gap:10px}
    .sk-line{height:11px;border-radius:6px;
      background:linear-gradient(90deg,rgba(99,102,241,.06) 0%,rgba(139,92,246,.16) 50%,rgba(99,102,241,.06) 100%);
      background-size:200% 100%;animation:shimmer 1.8s ease-in-out infinite}
    .sk-line.w80{width:80%}
    .sk-line.w60{width:60%}
    .sk-line.w45{width:45%}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* card grid */
    .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

    .opp-card{background:var(--glass-bg);
      backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);
      border-radius:var(--r);overflow:hidden;box-shadow:var(--glass-shadow);
      cursor:pointer;transition:all .22s ease}
    .opp-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:rgba(99,102,241,.35)}

    /* ── Hero tops ── */
    .card-top{padding:18px 18px 14px;
      background:linear-gradient(135deg,rgba(99,102,241,.88),rgba(139,92,246,.8));
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .card-top.crossdomain{
      background:linear-gradient(135deg,rgba(245,158,11,.85),rgba(236,72,153,.75))}
    .card-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
    .card-score{display:flex;align-items:baseline;gap:2px}
    .card-score .n{font-size:32px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.02em}
    .card-score .d{font-size:14px;color:rgba(255,255,255,.4)}
    .dir-pill{padding:4px 10px;border-radius:999px;
      background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);
      font-size:11.5px;font-weight:500;white-space:nowrap;
      border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px)}
    .card-top h3{margin:0;font-size:15px;font-weight:700;color:#fff;
      line-height:1.35;letter-spacing:-.01em}

    .card-body{padding:14px 18px}
    .card-source{display:inline-flex;align-items:center;gap:5px;
      padding:4px 10px;border-radius:999px;border:1px solid var(--accent-bd);
      background:var(--accent-bg);color:var(--accent);font-size:11.5px;
      font-weight:500;text-decoration:none;margin-bottom:10px;
      max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      transition:all .15s ease}
    .card-source:hover{background:rgba(99,102,241,.2);border-color:var(--accent)}
    .card-source svg{width:11px;height:11px;stroke:currentColor;fill:none;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .card-pain{font-size:13px;color:var(--ink-2);line-height:1.55;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-footer{padding:10px 18px;border-top:1px solid rgba(99,102,241,.1);
      display:flex;align-items:center;justify-content:space-between}
    .card-footer-tags{display:flex;gap:5px;flex-wrap:wrap}
    .tag{padding:2px 8px;border-radius:999px;
      background:rgba(99,102,241,.1);color:var(--accent-dim);
      font-size:11.5px;font-weight:500;border:1px solid rgba(99,102,241,.2)}
    .read-more{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:4px;white-space:nowrap}
    .read-more svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .type-badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px}
    .type-related{background:rgba(99,102,241,.22);color:#c4b5fd;border:1px solid rgba(99,102,241,.38)}
    .type-crossdomain{background:rgba(245,158,11,.2);color:#fcd34d;border:1px solid rgba(245,158,11,.38);
      animation:cd-pulse 2.6s ease-in-out infinite}
    @keyframes cd-pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 0 4px rgba(245,158,11,.1)}}

    /* ── Score Ring ── */
    .score-ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
    .score-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .ring-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
    .ring-fill{fill:none;stroke-width:3;stroke-linecap:round;
      transition:stroke-dasharray 1.1s cubic-bezier(.22,1,.36,1)}
    .ring-fill[data-tier="hot"] {stroke:#fbbf24;filter:drop-shadow(0 0 8px rgba(251,191,36,.75))}
    .ring-fill[data-tier="high"]{stroke:#a78bfa;filter:drop-shadow(0 0 7px rgba(167,139,250,.65))}
    .ring-fill[data-tier="mid"] {stroke:#22d3ee;filter:drop-shadow(0 0 6px rgba(34,211,238,.5))}
    .ring-fill[data-tier="low"] {stroke:rgba(255,255,255,.55)}
    .score-ring .ring-num{position:relative;z-index:1;font-weight:800;color:#fff;line-height:1;letter-spacing:-.02em}
    .score-ring.sm{width:52px;height:52px}
    .score-ring.sm .ring-num{font-size:15px}
    .score-ring.lg{width:72px;height:72px}
    .score-ring.lg .ring-num{font-size:21px}
    .score-ring.xl{width:88px;height:88px}
    .score-ring.xl .ring-num{font-size:26px}
    .score-ring .ring-sub{display:block;font-size:9px;color:rgba(255,255,255,.4);text-align:center;margin-top:2px;position:relative;z-index:1}

    /* ── Today full-detail cards ── */
    .today-detail-list{display:grid;gap:20px}
    .today-full-card{
      background:var(--glass-bg);backdrop-filter:var(--glass-blur);
      -webkit-backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-border);border-radius:var(--r);
      overflow:hidden;box-shadow:var(--glass-shadow)}
    .today-hero{position:relative;border-radius:0 !important}
    .today-hero .type-badge{position:absolute;top:18px;left:20px;margin-left:0}

    /* ── Detail Panel ── */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      z-index:30;opacity:0;pointer-events:none;transition:opacity .22s ease}
    .detail-overlay.open{opacity:1;pointer-events:all}

    .detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;
      background:rgba(10,14,30,.95);backdrop-filter:blur(28px) saturate(200%);
      -webkit-backdrop-filter:blur(28px) saturate(200%);
      overflow-y:auto;z-index:31;
      transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);
      box-shadow:-12px 0 48px rgba(0,0,0,.65),0 0 0 1px rgba(99,102,241,.14)}
    .detail-panel.open{transform:translateX(0)}

    .detail-close{position:sticky;top:0;z-index:2;
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;background:rgba(10,14,30,.94);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(99,102,241,.1)}
    .detail-close span{font-size:14px;font-weight:600;color:var(--ink-2)}
    .close-btn{border:0;background:transparent;cursor:pointer;
      color:var(--muted);padding:4px;border-radius:var(--r-sm)}
    .close-btn:hover{background:rgba(99,102,241,.12);color:var(--accent)}
    .close-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .detail-hero{padding:22px 20px 20px;
      background:linear-gradient(135deg,rgba(99,102,241,.88),rgba(139,92,246,.8));
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .detail-hero.crossdomain{
      background:linear-gradient(135deg,rgba(245,158,11,.85),rgba(236,72,153,.75))}
    .dh-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
    .dh-score{display:flex;flex-direction:column;align-items:center;gap:2px}
    .detail-hero h2{margin:0;font-size:18px;font-weight:700;color:#fff;line-height:1.35}

    .detail-source{padding:12px 20px;border-bottom:1px solid rgba(99,102,241,.1);
      display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
      background:rgba(99,102,241,.05)}
    .detail-source>span{font-size:12px;color:var(--muted);flex:0 0 auto}
    .detail-source a,.d-source-link{display:inline-flex;align-items:center;gap:5px;
      color:var(--accent);font-size:12.5px;font-weight:500;text-decoration:none;
      min-width:0;word-break:break-all}
    .detail-source a:hover,.d-source-link:hover{text-decoration:underline}
    .detail-source a svg,.d-source-link svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

    .detail-fields{padding:16px 20px;border-bottom:1px solid rgba(99,102,241,.08);display:grid;gap:10px}
    .df{display:grid;grid-template-columns:82px 1fr;gap:6px;font-size:13px}
    .df-lbl{color:var(--muted);font-weight:500;padding-top:1px}
    .df-val{color:var(--ink-2);line-height:1.55}

    .detail-score-section{padding:14px 20px;border-bottom:1px solid rgba(99,102,241,.08)}
    .sec-label{font-size:11px;font-weight:600;color:var(--muted);
      text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}
    .dim-row{display:grid;grid-template-columns:82px 1fr 34px;gap:8px;
      align-items:center;margin-bottom:7px}
    .dim-row:last-child{margin-bottom:0}
    .dm-meta{display:flex;flex-direction:column;gap:1px}
    .dm-name{font-size:12px;font-weight:500;color:var(--ink-2)}
    .dm-wt{font-size:11px;color:var(--subtle)}
    .bar-wrap{height:5px;background:rgba(99,102,241,.1);border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.22,1,.36,1)}
    .bar-fill.s5{background:linear-gradient(90deg,#10b981,#34d399)}
    .bar-fill.s4{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
    .bar-fill.s3{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
    .bar-fill.s2{background:linear-gradient(90deg,#f97316,#fb923c)}
    .bar-fill.s1{background:linear-gradient(90deg,#ef4444,#f87171)}
    .dm-score{font-size:12px;font-weight:600;color:var(--ink-2);text-align:right}
    .score-total-row{margin-top:11px;padding-top:10px;border-top:1px dashed rgba(99,102,241,.18);
      display:flex;align-items:center;justify-content:space-between}
    .score-total-row span{font-size:12px;color:var(--muted)}
    .score-total-row strong{font-size:20px;font-weight:800;color:var(--accent)}

    .detail-notes{padding:12px 20px;display:grid;gap:8px}
    .note{padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.55}
    .note.risk{background:rgba(120,20,10,.25);border:1px solid rgba(239,68,68,.18);color:#fca5a5}
    .note.check{background:rgba(5,46,22,.25);border:1px solid rgba(52,211,153,.18);color:#6ee7b7}
    .note strong{display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.65}

    /* ── Library view ── */
    .library-layout{padding:24px 28px}
    .lib-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .search-wrap{flex:0 0 260px;position:relative}
    .search-input{width:100%;height:38px;
      border:1.5px solid rgba(99,102,241,.18);border-radius:var(--r-sm);
      padding:0 12px 0 36px;
      background:rgba(12,16,38,.88);
      color:var(--ink);font-size:13.5px;outline:none;transition:all .15s ease}
    .search-input::placeholder{color:var(--subtle)}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15);background:rgba(12,16,38,.96)}
    .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
    .search-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .date-filter{display:flex;align-items:center;gap:6px}
    .date-input{height:38px;border:1.5px solid rgba(99,102,241,.18);border-radius:var(--r-sm);
      padding:0 10px;background:rgba(12,16,38,.88);color:var(--ink);
      font-size:13px;outline:none;transition:all .15s ease;cursor:pointer}
    .date-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
    .date-clear,.sort-btn{height:38px;padding:0 10px;
      border:1.5px solid rgba(99,102,241,.18);border-radius:var(--r-sm);
      background:rgba(12,16,38,.88);color:var(--muted);
      font-size:12px;cursor:pointer;transition:all .15s ease;white-space:nowrap}
    .date-clear:hover,.sort-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.08)}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:5px 13px;border-radius:999px;border:1.5px solid rgba(99,102,241,.18);
      background:rgba(12,16,38,.8);color:var(--muted);font-size:12.5px;font-weight:500;
      cursor:pointer;transition:all .15s ease}
    .chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.08)}
    .chip.active{border-color:var(--accent);background:var(--accent);color:white;
      box-shadow:0 0 14px rgba(99,102,241,.4)}

    .lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

// ── Utilities ──
function fmtDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function stripHtml(s) {
  return (s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function shortTitle(s, max=36) {
  const t = stripHtml(s);
  return t.length > max ? t.slice(0, max)+'…' : t;
}

function sourceHost(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
}

// ── Card data mapping (backend → frontend) ──
function mapCard(c) {
  let sourceTitles = c.source_titles || [];
  let sourceUrls = c.source_urls || [];
  if (typeof sourceTitles === 'string') { try { sourceTitles = JSON.parse(sourceTitles); } catch(e) { sourceTitles = []; } }
  if (typeof sourceUrls === 'string')   { try { sourceUrls = JSON.parse(sourceUrls); }   catch(e) { sourceUrls = []; } }
  if (!sourceTitles.length && c.source_title) sourceTitles = [c.source_title];
  if (!sourceUrls.length && c.source_url)     sourceUrls = [c.source_url];

  return {
    id: c.id,
    title: c.title,
    direction: c.direction,
    sourceTitles: sourceTitles,
    sourceUrls: sourceUrls,
    sourceTitle: sourceTitles[0] || c.source_title || '',
    sourceLink: sourceUrls[0] || c.source_url || '#',
    sourceDate: c.created_at ? fmtDate(c.created_at) : '',
    user: c.user_persona,
    pain: c.pain_point,
    why: c.ai_solution,
    mvp: c.mvp_plan,
    risk: c.risks,
    check: c.next_step,
    scores: typeof c.score === 'object' ? c.score : {},
    score: (c.score && c.score.total) ? c.score.total : 0,
    cardType: c.card_type || 'related',
    tags: [c.direction],
    savedAt: c.created_at || new Date().toISOString(),
  };
}

async function loadTodayCards() {
  const res = await fetch('/api/cards/today', { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  const data = await res.json();
  return { cards: (data.cards || []).map(mapCard), date: data.date || '', generated: data.generated || 0 };
}

async function loadLibraryCards() {
  const res = await fetch('/api/cards', { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  const data = await res.json();
  return (data.cards || []).map(mapCard);
}

async function loadSources() {
  const res = await fetch('/api/sources', { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  const data = await res.json();
  return (data.items || []).map(item => {
    const raw = item.published_at || item.pubDate || '';
    let iso = '';
    if (raw) { try { iso = new Date(raw).toISOString().slice(0,10); } catch(e) { iso = raw; } }
    return {
      title: item.title || '',
      link: item.url || item.link || '',
      description: item.description || '',
      pubDate: iso,
      pubDateRaw: raw,
    };
  });
}

function showError(title, detail) {

}

// ── Main init ──
async function init() {
  showLoading();

  let loadError = null;

  try {
    const [todayResult, sourcesResult] = await Promise.all([
      loadTodayCards(),
      loadSources(),
    ]);
    todayCards = todayResult.cards;
    window._todayDate = todayResult.date;
    window._isToday = todayResult.is_today !== false;
    allSources = sourcesResult;
  } catch (e) {
    loadError = e;
    console.error('Failed to load today data:', e);
  }

  if (!loadError) {
    try {
      library = await loadLibraryCards();
    } catch (e) {
      console.warn('Failed to load library:', e);
      library = [];
    }
  }

  if (loadError) {
    console.warn('Backend unavailable, switching to mock data:', loadError);
    todayCards = MOCK_DATA.todayCards;
    library    = MOCK_DATA.library;
    allSources = MOCK_DATA.sources;
    window._todayDate = today();
    window._isToday   = true;
    isMockMode = true;
  }

  // Update stats
  document.getElementById('stat-fetched').textContent = allSources.length;
  document.getElementById('stat-cards').textContent   = todayCards.length;
  document.getElementById('stat-time').textContent    = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('stat-bar').style.display   = '';
  document.getElementById('today-badge').textContent  = todayCards.length;
  document.getElementById('lib-badge').textContent    = library.length;
  if (isMockMode) {
    const sb = document.getElementById('stat-bar');
    sb.insertAdjacentHTML('beforeend',
      '<span class="stat-sep">·</span><span class="stat-item" style="color:#fbbf24;font-weight:600">⚡ 演示模式</span>');
  }

  const displayDate = window._todayDate || today();
  if (todayCards.length === 0) {
    document.getElementById('page-sub').textContent = `📅 ${displayDate} · 雷达扫描中，今日信号待接收`;
  } else {
    document.getElementById('page-sub').textContent = `📅 ${displayDate} · 捕获 ${todayCards.length} 个灵感火花`;
  }
  if (!window._isToday) {
    document.getElementById('today-date-hd').textContent = `${displayDate} 机会`;
  } else {
    document.getElementById('today-date-hd').textContent = `${today()} 机会`;
  }

  renderTodayCards();
  renderSources();

  document.getElementById('today-loading').style.display = 'none';
  document.getElementById('today-cards').style.display   = '';
}

function renderTodayCards() {

    container.innerHTML = `<div class="lib-empty">

  const linkSvg = '<svg viewBox="0 0 24 24" width="11" height="11" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';

    const sourcesHtml = card.sourceTitles.length > 1

          `<a href="${card.sourceUrls[j] || '#'}" target="_blank">${linkSvg}<span>${escapeHtml(shortTitle(t, 50))}</span></a>`

      : `<a href="${card.sourceLink}" target="_blank">${linkSvg}<span>${escapeHtml(shortTitle(card.sourceTitle || card.sourceLink, 50))}</span></a>`;

    const dimsHtml = DIMS.map(d => {
      const raw = card.scores[d.key];
      const v = (raw && typeof raw === 'object') ? (raw.value || 0) : (Number(raw) || 0);

      const pct = Math.round(d.weight / 10.0 * 100);
      return `<div class="dim-row">
        <div class="dm-meta"><span class="dm-name">${d.name}${hint}</span><span class="dm-wt">×${pct}%${reason ? ' — ' + reason : ''}</span></div>
        <div class="bar-wrap"><div class="bar-fill ${scoreCls(v)}" style="width:${v/5*100}%"></div></div>

    }).join('');

    const animClass = isCross ? 'anim-crossdomain' : 'anim-related';
    const el = document.createElement('div');
    el.className = `today-full-card ${animClass}`;
    el.style.animationDelay = (i * 120) + 'ms';
    el.innerHTML = `
      <div class="detail-hero today-hero${isCross ? ' crossdomain' : ''}">
        ${typeBadge}
        <div class="dh-top">
          <div class="dh-score">
            ${scoreRingHtml(card.score, 'xl')}
            <span class="ring-sub" style="margin-top:4px;font-size:9px;color:rgba(255,255,255,.4)">综合评分</span>
          </div>
          <span class="dir-pill">${escapeHtml(card.direction)}</span>
        </div>
        <h2>${escapeHtml(card.title)}</h2>
      </div>
      <div class="detail-source">${sourcesHtml}</div>
      <div class="detail-fields">
        <div class="df"><span class="df-lbl">用户是谁</span><span class="df-val">${escapeHtml(card.user)}</span></div>
        <div class="df"><span class="df-lbl">用户痛点</span><span class="df-val">${escapeHtml(card.pain)}</span></div>
        <div class="df"><span class="df-lbl">为什么 AI</span><span class="df-val">${escapeHtml(card.why)}</span></div>
        <div class="df"><span class="df-lbl">MVP 方案</span><span class="df-val">${escapeHtml(card.mvp)}</span></div>
      </div>
      <div class="detail-score-section">

          <span>加权总分（满分 10 分）</span>
          <strong>${card.score.toFixed(1)} / 10</strong>

        <div class="note risk"><strong>主要风险</strong><span>${escapeHtml(card.risk)}</span></div>
        <div class="note check"><strong>下一步验证</strong><span>${escapeHtml(card.check)}</span></div>

}

// ── Render feed items ──
function renderSources() {
  const list = document.getElementById('source-list');
  list.innerHTML = '';
  const dateVal = document.getElementById('source-date') ? document.getElementById('source-date').value : '';
  const q = (document.getElementById('source-search') ? document.getElementById('source-search').value : '').toLowerCase();
  const filtered = allSources.filter(item => {
    const md = !dateVal || (item.pubDate && item.pubDate.startsWith(dateVal));
    const mq = !q || (item.title||'').toLowerCase().includes(q) || (item.description||'').toLowerCase().includes(q);
    return md && mq;
  }).sort((a, b) => {
    const da = a.pubDate || '', db = b.pubDate || '';
    return sourceSortDesc ? db.localeCompare(da) : da.localeCompare(db);
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="source-empty">暂无信号</div>';
    return;
  }
  const convertedLinks = new Set(todayCards.flatMap(c => c.sourceUrls.length ? c.sourceUrls : [c.sourceLink]));
  filtered.forEach(item => {
    const isConv = convertedLinks.has(item.link);
    const el = document.createElement('div');
    el.className = 'source-item' + (isConv ? ' converted' : '');
    el.innerHTML = `
      <div class="source-item-main">
        <a href="${item.link||'#'}" target="_blank">${stripHtml(item.title||'(无标题)')}</a>
        ${item.description ? '<div style="color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+stripHtml(item.description)+'</div>' : ''}
        <div class="source-item-meta">${item.pubDateRaw ? fmtDate(item.pubDateRaw) : (item.pubDate||'')} · ${sourceHost(item.link||'')}</div>
      </div>
      ${isConv ? '<span class="conv-badge">已生成机会卡</span>' : ''}`;
    list.appendChild(el);
  });
}

  const grid = document.getElementById('lib-grid');
  const q = (document.getElementById('lib-search').value||'').toLowerCase();
  const dateVal = document.getElementById('lib-date').value;
  const filtered = library.filter(c => {
    const mf = activeFilter==='全部' || c.direction===activeFilter || (c.tags||[]).includes(activeFilter);
    const mq = !q || c.title.toLowerCase().includes(q) || (c.pain||'').toLowerCase().includes(q);
    const md = !dateVal || (c.savedAt && c.savedAt.startsWith(dateVal));
    return mf && mq && md;
  });
  grid.innerHTML = '';
  if (!filtered.length) {
    const emsg = library.length
      ? '<div class="lib-empty">未找到匹配的机会卡，试试其他关键词或方向</div>'
      : '<div class="lib-empty"><p style="font-size:14px;color:var(--ink-2);margin:0 0 8px">📚 机会库为空</p><p style="margin:0">每日生成的机会卡将自动累积到这里，支持搜索和筛选</p></div>';
    grid.innerHTML = emsg;
    return;
  }
  filtered.forEach(c => {
    const isCross = c.cardType === 'crossdomain';
    const typeBadge = isCross
      ? "<span class='type-badge type-crossdomain'>⚡ 跨界创新</span>"
      : "<span class='type-badge type-related'>🔍 相关洞察</span>";
    const animClass = isCross ? 'anim-crossdomain' : 'anim-related';
    const el = document.createElement('div');
    el.className = `lib-card ${animClass}`;
    el.innerHTML = `
      <div class="lib-top${isCross ? ' crossdomain' : ''}">
        ${scoreRingHtml(c.score, 'sm')}
        <div class="lib-top-info">
          ${typeBadge}
          <h3>${escapeHtml(c.title)}</h3>
        </div>
      </div>
      <div class="lib-body">
        <div class="lf"><div class="lf-l">目标用户</div><div class="lf-v">${escapeHtml(c.user)}</div></div>
        <div class="lf"><div class="lf-l">核心痛点</div><div class="lf-v">${escapeHtml(c.pain)}</div></div>
      </div>
      <div class="lib-foot">${(c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`;
    el.addEventListener('click', () => openDetail(c));
    grid.appendChild(el);
  });
}

// ── Detail panel ──
function openDetail(card) {
  const score = card.score || 0;
  const isCross = card.cardType === 'crossdomain';
  // Update hero gradient
  const heroEl = document.getElementById('d-hero');
  heroEl.className = `detail-hero${isCross ? ' crossdomain' : ''}`;
  // Score ring
  document.getElementById('d-score-ring').innerHTML =
    scoreRingHtml(score, 'xl') +
    '<span style="font-size:9px;color:rgba(255,255,255,.4);margin-top:4px">综合评分</span>';
  document.getElementById('d-dir').textContent     = card.direction || '未分类';
  document.getElementById('d-title').textContent   = card.title;

  const linkSvg = '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
  const sourcesEl = document.getElementById('d-sources');
  sourcesEl.innerHTML = '<span>来源</span>' + (card.sourceTitles.length > 1
    ? card.sourceTitles.map((t, i) => `<a class="d-source-link" href="${card.sourceUrls[i] || '#'}" target="_blank">${linkSvg}<span>${escapeHtml(shortTitle(t, 50))}</span></a>`).join('')
    : `<a class="d-source-link" href="${card.sourceLink}" target="_blank">${linkSvg}<span>${escapeHtml(shortTitle(card.sourceTitle || card.sourceLink, 50))}</span></a>`);

  document.getElementById('d-user').textContent    = card.user;
  document.getElementById('d-pain').textContent    = card.pain;
  document.getElementById('d-why').textContent     = card.why;
  document.getElementById('d-mvp').textContent     = card.mvp;
  document.getElementById('d-risk').textContent    = card.risk;
  document.getElementById('d-check').textContent   = card.check;
  document.getElementById('d-total').textContent   = score.toFixed(1) + ' / 10';
  renderDims(card.scores, document.getElementById('d-dims'));
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
}

document.getElementById('close-detail').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', closeDetail);

function renderDims(scores, container) {
  container.innerHTML = '';
  const DIMS_TOTAL_WEIGHT = 10.0;
  DIMS.forEach(d => {
    const raw = scores[d.key];
    const v = (raw && typeof raw === 'object') ? (raw.value || 0) : (Number(raw) || 0);
    const reason = (raw && typeof raw === 'object') ? (raw.reason || '') : '';
    const pct = Math.round(d.weight / DIMS_TOTAL_WEIGHT * 100);
    const row = document.createElement('div');
    row.className = 'dim-row';
    const hint = d.hint ? ` <span style="color:var(--warn);font-size:10px">${d.hint}</span>` : '';
    row.innerHTML = `
      <div class="dm-meta"><span class="dm-name">${d.name}${hint}</span><span class="dm-wt">×${pct}%${reason ? ' — ' + reason : ''}</span></div>
      <div class="bar-wrap"><div class="bar-fill ${scoreCls(v)}" style="width:0" data-w="${v/5*100}%"></div></div>
      <span class="dm-score">${v}/5</span>`;
    container.appendChild(row);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    container.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.w; });
  }));
}

// ── Hamburger / Sidebar toggle (mobile) ──
const hamburgerBtn   = document.getElementById('hamburger-btn');
const sidebarEl      = document.querySelector('.sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');

function openSidebar()  { sidebarEl.classList.add('open');    sidebarOverlay.classList.add('open'); }
function closeSidebar() { sidebarEl.classList.remove('open'); sidebarOverlay.classList.remove('open'); }

hamburgerBtn.addEventListener('click', () => {
  sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
});
sidebarOverlay.addEventListener('click', closeSidebar);

// ── Navigation ──
document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (window.innerWidth <= 1100) closeSidebar();
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = btn.dataset.view;
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
    if (v === 'today') {
      document.getElementById('page-title').textContent = '今日机会';
      document.getElementById('page-sub').textContent   = `${today()} · 捕获 ${todayCards.length} 个灵感火花`;
    } else if (v === 'library') {
      document.getElementById('page-title').textContent = '机会库';
      document.getElementById('page-sub').textContent   = `共 ${library.length} 张机会卡`;
      renderLibrary();
    } else {
      document.getElementById('page-title').textContent = '信息源';
      document.getElementById('page-sub').textContent   = `AI HOT 精选 · ${allSources.length} 条信号`;
    }
  });
});

// ── Library filters ──
document.getElementById('filter-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeFilter = chip.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  renderLibrary();
});
document.getElementById('lib-search').addEventListener('input', renderLibrary);
document.getElementById('lib-date').addEventListener('input', renderLibrary);
document.getElementById('lib-date-clear').addEventListener('click', () => {
  document.getElementById('lib-date').value = '';
  renderLibrary();
});
document.getElementById('source-date').addEventListener('input', renderSources);
document.getElementById('source-date-clear').addEventListener('click', () => {
  document.getElementById('source-date').value = '';
  renderSources();
});
document.getElementById('source-sort').addEventListener('click', () => {
  sourceSortDesc = !sourceSortDesc;
  document.getElementById('source-sort').textContent = sourceSortDesc ? '↓ 最新在前' : '↑ 最旧在前';
  renderSources();
});
document.getElementById('source-search').addEventListener('input', renderSources);

// ── Refresh ──
document.getElementById('refresh-btn').addEventListener('click', () => {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelector('.nav-item[data-view="today"]').classList.add('active');
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-today').classList.add('active');
  document.getElementById('page-title').textContent = '今日机会';
  init();
});

// ── Start ──
init();
</script>
</body>
</html>
