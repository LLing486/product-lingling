name: 刷新机会卡快照（Cloudflare Pages）

# 为什么需要它：CF Pages 那个入口没有后端，卡片全靠 frontend/data 里的静态快照。
# 快照不刷新，那个入口就停在旧日期（2026-09 曾因此停了 34 天没人发现）。
# 跑在 GitHub 上 = 不依赖任何一台自己的机器开没开机。

on:
  schedule:
    # 每天 00:45 UTC = 08:45 CST（源站 08:30 出卡之后）
    - cron: "45 0 * * *"
  workflow_dispatch: {} # 支持在 Actions 页面手动点 Run workflow

permissions:
  contents: write # 需要把刷新后的快照提交回仓库

concurrency:
  group: lingling-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 导出快照（只读源站接口）
        env:
          LING_API_BASE: ${{ secrets.LING_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${LING_API_BASE:-}" ]; then
            echo "::error::缺少仓库 secret LING_API_BASE（源站后端地址）"
            exit 1
          fi
          python3 scripts/build_cards_snapshot.py "$LING_API_BASE"
          python3 -c "import json;d=json.load(open('frontend/data/cards-index.json'));cs=d.get('cards') or [];ds=sorted({(c.get('created_at') or '')[:10] for c in cs if c.get('created_at')});print('快照：%d 张，%s → %s（%s）'%(len(cs),ds[0],ds[-1],d.get('updated_at')))"

      - name: 提交快照
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 机会卡快照刷新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 发布到 Cloudflare Pages（生产分支 main）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=product-lingling --branch=main --commit-dirty=true
